<text x="493.6" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">the rule, on this grid</text>
<text x="493.6" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">seeds are the lowest unclaimed cell ids, in order</text>
<text x="493.6" y="109" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">a group absorbs the unclaimed face-neighbour whose</text>
<text x="493.6" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">shared-face area, summed over every member, is largest</text>
<text x="493.6" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">(ties break on ascending id), until it holds 4 cells</text>
<text x="493.6" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">or its frontier is empty</text>
<text x="493.6" y="177" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e"></text>
<text x="493.6" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">faces between two members are dropped (dashed);</text>
<text x="493.6" y="211" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">every other face is kept with its stored winding,</text>
<text x="493.6" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">so each group emits one polyhedron</text>
<text x="493.6" y="245" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e"></text>
<text x="493.6" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">adjacency is by shared FACE, never by shared node:</text>
<text x="493.6" y="279" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">two cells touching at a corner never merge</text>
<text x="450" y="425" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">cell widths and heights differ on purpose: on a uniform grid every shared face has the same area and only the id tie-break is visible</text>
</svg>
