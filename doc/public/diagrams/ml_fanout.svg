<text x="450" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">so one mesh is alive at a time (two for a t → t+n pair); the feature-matrix column order is the versioned contract (FEATURE_SCHEMA_VERSION):</text>
