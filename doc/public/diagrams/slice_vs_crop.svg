<text x="480" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">crop keeps geometry and connectivity intact (regions remapped, crop:original_*_id on request);</text>
<text x="480" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">slice makes new points at the crossings, interpolates point_data there and replicates each parent's cell_data — a volume yields triangles and quads, a surface yields lines.</text>
<text x="480" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">Both take the plane as (origin, normal); crop also takes a bounding box or a cell_data predicate (crop_predicate), and mode selects the all-nodes / any-node rule.</text>
