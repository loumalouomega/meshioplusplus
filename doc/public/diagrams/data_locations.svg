<text x="24" y="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">cross-cutting rules</text>
<text x="24" y="386" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">• non-finite values are always excluded from every reduction; NanPolicy (ignore / replace / fail) only decides what reaches the output</text>
<text x="24" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">• an op writing cell_data emits exactly NumCellBlocks() arrays; an op reading one validates the block count first</text>
<text x="24" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">• components = product of the trailing dims; 1-D scalars stay 1-D; point/cell sets never enter the core</text>
<text x="24" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">not data operations, though the CLI groups them under `data`:</text>
<text x="24" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">gradient · hessian · estimate_error · data_integrate read geometry (face areas, cell measures, adjacency): mesh operations that happen to produce arrays</text>
<text x="24" y="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">names may contain ':' (gmsh:physical, refine:level); the CLI splits `data rename OLD:NEW` on the LAST colon and `data calc "NAME = EXPR"` on the FIRST '='</text>
