<text x="290" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#eb6834">mirrored: provenance_scope_push / _pop</text>
<text x="480" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">Only four write paths reach registry_write_ex, so a record carried by WriteOptions would be invisible from Python and WASM, the surfaces most callers use.</text>
<text x="480" y="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">A thread-local, RAII-scoped record (the set_buffer_allocator shape, per thread because writes are not serialised) is read by every writer exactly where</text>
<text x="480" y="464" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">it already read the credit line, so no signature changed. The public entry points call provenance_begin_write(), which keeps a note raised by an unrelated</text>
<text x="480" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">earlier operation out of THIS file's header; spanning several writes is what an explicit scope is for. Nothing re-emits a block read from an input file:</text>
<text x="480" y="496" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">writers render from the live record only, so provenance is replaced, never appended.</text>
