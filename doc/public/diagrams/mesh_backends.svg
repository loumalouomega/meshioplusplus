<text x="694" y="122.05" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#52514e">required by the Python extension, which views numpy memory into it</text>
<rect x="512" y="160" width="364" height="84" rx="6" fill="#008300" fill-opacity="0.12" stroke="#008300" stroke-width="1.5"/>
