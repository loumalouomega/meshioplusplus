<text x="694" y="222.05" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#52514e">lazy whole-mesh CSR (GlobalConnectivity()); the WASM build uses it</text>
<rect x="512" y="260" width="364" height="84" rx="6" fill="#4a3aa7" fill-opacity="0.12" stroke="#4a3aa7" stroke-width="1.5"/>
<text x="694" y="294.05" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0b0b0b">KRATOS</text>
<text x="694" y="309.55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#52514e">stages canonically, materialises a Kratos-style ModelPart lazily</text>
<text x="694" y="322.05" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle" fill="#52514e">SubModelParts ⇄ named regions; kratos_bridge.hpp → a real Kratos::ModelPart</text>
<text x="694" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#52514e">MESHIOPLUSPLUS_MESH_BACKEND — exactly one is compiled in</text>
<text x="450" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">a format, an operation or a binding written against the uniform API compiles unchanged under all three backends,</text>
<text x="450" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">which is what CI's cpp-tests matrix (MESHIO×STL, MESHIO×OpenMP, NATIVE×OpenMP, KRATOS×OpenMP) checks on every change;</text>
<text x="450" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">NATIVE and KRATOS canonicalise dtypes at ingest within kind (floats → Float64, ints → Int64, never int → float), and every backend sorts data names,</text>
<text x="450" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" fill="#52514e">so on-disk field order and region canonicalisation are byte-identical across backends and thread counts</text>
