<text x="107" y="353.66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle" fill="#52514e">copying API, ~400 MB wheel</text>
<rect x="200" y="322" width="166" height="40" rx="6" fill="#898781" fill-opacity="0.12" stroke="#898781" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="283" y="340.54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#0b0b0b">DOLFINx</text>
<text x="283" y="353.66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle" fill="#52514e">one cell type, MPI, basix order</text>
<text x="384" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">Phase 2 stubs: they raise NotImplementedError by name; the constraints are recorded on the page</text>
<text x="24" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0b0b0b">the zero-copy contract:</text>
<text x="24" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">a buffer is shared when the target takes it as-is; every copy is a note (warned), or an InteropError under zero_copy_only=True.</text>
<text x="24" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">Derived arrays (VTK offsets/types) are not losses and never warn. Every wrapper keeps the shared arrays alive (_meshioplusplus_refs).</text>
<text x="24" y="452" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">GPU: host → device is always a transfer across the bus; the feature removes the file round-trip and every extra copy on either side of that one transfer,</text>
<text x="24" y="468" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">so to_cupy takes no zero_copy_only (a lie on a 100 %-copy path) and from_cupy performs one deliberate, noted device → host copy per array.</text>
<text x="24" y="484" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#52514e">There is no [gpu], [torch] or [jax] extra: those wheels are CUDA-version-specific, so the gate names the exact pip install instead.</text>
