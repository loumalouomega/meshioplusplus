name: sonarcloud

# SonarCloud analysis of `master` (doc/static_analysis.md, sonar-project.properties).
#
# A workflow of its own, not a step of ci.yml's `coverage` job: that job builds
# and runs both instrumented suites first (hours at -O0), and a newer push to
# `master` cancels it, so its scan rarely ran. Here the C/C++ analyzer gets its
# compilation database from CMake configure alone (nothing is compiled: no
# source includes a header generated at build time), and the Python analysis
# needs nothing built, so a scan takes minutes.
#
# The price is coverage: no tests run here, so SonarCloud shows none. Codecov,
# fed by the `coverage` job, remains the coverage report.
on:
  push:
    branches: [master]
  workflow_dispatch:

# One scan at a time; a newer push waits for the running scan instead of
# cancelling it, so every scan that starts also finishes.
concurrency:
  group: sonarcloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The `secrets` context is not allowed in step-level `if:`; hoist it.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Warn if SONAR_TOKEN is unset
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::warning title=SonarCloud not run::SONAR_TOKEN is not set, so the SonarCloud analysis was skipped. Import the repository on sonarcloud.io, turn Automatic Analysis off, and add the SONAR_TOKEN secret (doc/static_analysis.md)."

      # Full history: SonarCloud reads `git blame` to tell new code from old.
      # No Git LFS: fixtures are test data, which the analysis excludes.
      - uses: actions/checkout@v4
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          lfs: false
          fetch-depth: 0
      # Vendored Eigen and nlohmann/json are included by analysed sources.
      - name: Initialise submodules
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: ./.github/actions/init-submodules
        with:
          paths: src/cpp/third_party/eigen src/cpp/third_party/json

      - uses: actions/setup-python@v5
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          python-version: "3.12"

      # The same optional libraries as the `coverage` job, so the analyzer
      # sees the HDF5, netCDF, zlib, TBB and OpenCASCADE code paths with their
      # headers resolved. See ci.yml for why packages.microsoft.com is removed.
      - name: Install native headers
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev liblzma-dev libtbb-dev pkg-config \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev
          python -m pip install --upgrade pip
          pip install pybind11 ninja

      # Two configure-only trees, mirroring the `coverage` job's two builds:
      # the GoogleTest/C API tree, and the Python extension's, the only one
      # that compiles bindings/python/_core.cpp. A source both compile is
      # analysed once.
      - name: Generate the compilation database
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          common=(-G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
                  -DMESHIOPLUSPLUS_WITH_HDF5=ON -DMESHIOPLUSPLUS_WITH_NETCDF=ON
                  -DMESHIOPLUSPLUS_WITH_ZLIB=ON -DMESHIOPLUSPLUS_WITH_OCCT=ON
                  -DPython_EXECUTABLE="$(which python)")
          cmake -S . -B build-sonar-cpp "${common[@]}" \
            -DMESHIOPLUSPLUS_BUILD_TESTS=ON -DMESHIOPLUSPLUS_BUILD_C_API=ON \
            -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF
          cmake -S . -B build-sonar-py "${common[@]}" \
            -DMESHIOPLUSPLUS_BUILD_PYTHON=ON \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          jq -s 'add | unique_by(.file)' \
            build-sonar-cpp/compile_commands.json build-sonar-py/compile_commands.json > compile_commands.json
          jq length compile_commands.json

      # A failed scan (a SonarCloud outage, an expired token) does not fail the
      # workflow: it is not a defect in the commit under analysis.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8
