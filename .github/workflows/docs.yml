name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Build Doxygen API reference
        run: doxygen Doxyfile
        working-directory: doc

      # The browser viewer is deployed as a second static island alongside the
      # Doxygen one, into this same Pages artifact. A repository gets one Pages
      # deployment, so a separate workflow would fight this one over the
      # `pages` concurrency group and overwrite the docs.
      #
      # The Emscripten build is required, not incidental: src/wasm/dist/ is
      # gitignored, so the package the viewer consumes does not exist until it
      # is built. `npm ci` must follow it, because npm *copies* a `file:`
      # dependency rather than symlinking it.
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.3"
      - name: Build the meshio++ WASM package
        run: ./build/configure-wasm.sh --build
      - name: Build the viewer
        working-directory: src/viewer
        env:
          VITE_BASE: /meshioplusplus/viewer/
        run: |
          npm ci
          npm run build:web

      - name: Install and build (VitePress)
        run: |
          cd doc
          npm install
          npm run docs:build
      - name: Merge Doxygen output into the VitePress site
        run: cp -r doc/doxygen-build/html doc/.vitepress/dist/api
      - name: Merge the viewer into the VitePress site
        # doc/.vitepress/dist/viewer/ already exists at this point (VitePress
        # copied doc/public/viewer/*.png there), so a plain `cp -r SRC DST`
        # would nest dist-web inside it (viewer/dist-web/index.html) instead
        # of merging - the trailing `/.` copies dist-web's *contents* into
        # the existing directory so index.html lands at viewer/index.html.
        run: cp -r src/viewer/dist-web/. doc/.vitepress/dist/viewer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
