name: ci

on:
  push:
    branches: [main, port-to-c++]
  pull_request:
    branches: [main, port-to-c++]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  cpp-tests:
    name: C++ tests (GoogleTest / CTest)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev
      - name: Install build tools
        run: python -m pip install --upgrade pip pybind11 cmake ninja
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DMESHIO_BUILD_TESTS=ON
          -DPython_EXECUTABLE=$(which python)
          -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
      - name: Build
        run: cmake --build build
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure

  test:
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # System HDF5/netCDF/zlib light up the native C++ paths.  When they are
      # absent (Windows), the h5py/netCDF4 Python wheels and the stdlib zlib
      # keep every format working via the fallback shims, so the suite still
      # passes -- this is the same story users get on a plain `pip install`.
      - name: Install native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev liblzma-dev

      - name: Install native libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5 netcdf

      - name: Configure build (Linux/macOS - native paths on)
        if: runner.os != 'Windows'
        shell: bash
        run: echo 'CMAKE_ARGS=-DMESHIO_WITH_HDF5=ON -DMESHIO_WITH_NETCDF=ON -DMESHIO_WITH_ZLIB=ON' >> "$GITHUB_ENV"

      - name: Configure build (Windows - Python fallbacks)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_ARGS=-DMESHIO_WITH_HDF5=OFF -DMESHIO_WITH_NETCDF=OFF -DMESHIO_WITH_ZLIB=OFF" >> $env:GITHUB_ENV

      - name: Install meshio and test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-codeblocks pytest-cov h5py netCDF4
          pip install . --verbose

      - name: Run tests
        run: pytest tests/ --codeblocks --cov meshio --cov-report xml --cov-report term

      - name: Upload coverage
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
