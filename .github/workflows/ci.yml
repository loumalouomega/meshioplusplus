name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  cpp-tests:
    name: C++ tests (${{ matrix.mesh }} mesh / ${{ matrix.parallel }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two historical parallel-backend legs (MESHIO mesh + Python
        # extension) plus one leg per non-default mesh backend (standalone,
        # no pybind11 -- the CMake FATAL_ERROR forbids Python with them).
        include:
          - { mesh: MESHIO, parallel: STL,    python: ON }
          - { mesh: MESHIO, parallel: OPENMP, python: ON }
          - { mesh: NATIVE, parallel: OPENMP, python: OFF }
          - { mesh: KRATOS, parallel: OPENMP, python: OFF }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive  # vendored Eigen (MED transpose)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev libtbb-dev
      - name: Install build tools
        run: python -m pip install --upgrade pip pybind11 cmake ninja
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DMESHIOPLUSPLUS_BUILD_TESTS=ON
          -DMESHIOPLUSPLUS_MESH_BACKEND=${{ matrix.mesh }}
          -DMESHIOPLUSPLUS_PARALLEL_BACKEND=${{ matrix.parallel }}
          -DMESHIOPLUSPLUS_BUILD_PYTHON=${{ matrix.python }}
          -DPython_EXECUTABLE=$(which python)
          -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
      - name: Build
        run: cmake --build build
      - name: Run C++ tests
        run: ctest --test-dir build --output-on-failure
      # The templated Kratos bridge promises to populate a real Kratos-like
      # ModelPart. Compile a TU against the actual CoSimIO headers (fetched at
      # CI time only -- CoSimIO's BSD-4-clause license is never vendored into
      # this MIT repo) to catch API drift. One leg is enough.
      - name: Bridge compile-check vs CoSimIO headers
        if: matrix.mesh == 'KRATOS'
        run: |
          git clone --depth 1 https://github.com/KratosMultiphysics/CoSimIO.git /tmp/CoSimIO
          # co_sim_io_api.hpp is generated by CoSimIO's CMake configure
          # (generate_export_header), so a fresh clone doesn't have it. This
          # is a header-only compile check with no library to link, so a
          # no-op stub of the export macros is all define.hpp needs.
          if [ ! -f /tmp/CoSimIO/co_sim_io/includes/co_sim_io_api.hpp ]; then
            cat > /tmp/CoSimIO/co_sim_io/includes/co_sim_io_api.hpp <<'EOF'
          #ifndef CO_SIM_IO_API_H
          #define CO_SIM_IO_API_H
          #define CO_SIM_IO_API
          #define CO_SIM_IO_NO_EXPORT
          #define CO_SIM_IO_DEPRECATED
          #define CO_SIM_IO_DEPRECATED_EXPORT
          #define CO_SIM_IO_DEPRECATED_NO_EXPORT
          #endif
          EOF
          fi
          cat > /tmp/bridge_check.cpp <<'EOF'
          // Compile-only check: the header-only bridge + the real CoSimIO
          // ModelPart headers coexist and the bridge's creation calls match
          // a CoSimIO-like surface (CoSimIO's CreateNewElement takes an
          // ElementType enum, so it goes through a thin adapter -- exactly
          // what doc/cpp_backends.md documents for real-Kratos use).
          #include "includes/model_part.hpp"
          #include "meshioplusplus/kratos_bridge.hpp"
          int main() {
              meshioplusplus::ModelPart src("Main");
              src.CreateNewNode(1, 0.0, 0.0, 0.0);
              src.CreateNewNode(2, 1.0, 0.0, 0.0);
              src.CreateNewNode(3, 0.0, 1.0, 0.0);
              src.CreateNewElement("Element2D3N", 1, {1, 2, 3});
              CoSimIO::ModelPart dest("dest");
              for (const auto& r_node : src.Nodes())
                  dest.CreateNewNode(static_cast<CoSimIO::IdType>(r_node.Id()), r_node.X(),
                                     r_node.Y(), r_node.Z());
              for (const auto& r_elem : src.Elements()) {
                  CoSimIO::ConnectivitiesType conn(r_elem.NodeIds().begin(),
                                                   r_elem.NodeIds().end());
                  dest.CreateNewElement(static_cast<CoSimIO::IdType>(r_elem.Id()),
                                        CoSimIO::ElementType::Triangle2D3, conn);
              }
              return dest.NumberOfElements() == 1 ? 0 : 1;
          }
          EOF
          g++ -std=c++20 -fsyntax-only -Icpp/include -I/tmp/CoSimIO/co_sim_io \
            -I/tmp/CoSimIO/external_libraries /tmp/bridge_check.cpp
          echo "bridge compile-check OK"

  test:
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive  # vendored Eigen (MED transpose)

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # System HDF5/netCDF/zlib light up the native C++ paths.  When they are
      # absent (Windows), the h5py/netCDF4 Python wheels and the stdlib zlib
      # keep every format working via the fallback shims, so the suite still
      # passes -- this is the same story users get on a plain `pip install`.
      - name: Install native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev liblzma-dev libtbb-dev

      - name: Install native libraries (macOS)
        if: runner.os == 'macOS'
        # libomp lets the AUTO parallel backend use OpenMP on Apple clang
        # (libc++ has no parallel STL).
        run: brew install hdf5 netcdf libomp

      # macOS 13.3+ deployment target: required for std::format (its
      # floating-point formatting symbols live in the OS libc++ dylib).
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.3' >> "$GITHUB_ENV"

      - name: Configure build (Linux/macOS - native paths on)
        if: runner.os != 'Windows'
        shell: bash
        run: echo 'CMAKE_ARGS=-DMESHIOPLUSPLUS_WITH_HDF5=ON -DMESHIOPLUSPLUS_WITH_NETCDF=ON -DMESHIOPLUSPLUS_WITH_ZLIB=ON' >> "$GITHUB_ENV"

      - name: Configure build (Windows - Python fallbacks)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_ARGS=-DMESHIOPLUSPLUS_WITH_HDF5=OFF -DMESHIOPLUSPLUS_WITH_NETCDF=OFF -DMESHIOPLUSPLUS_WITH_ZLIB=OFF" >> $env:GITHUB_ENV

      - name: Install meshio++ and test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-codeblocks h5py netCDF4
          pip install . --verbose

      # Coverage is not collected here -- the dedicated `coverage` job below
      # owns it, so this matrix stays focused on cross-platform correctness.
      - name: Run tests
        run: pytest tests/ --codeblocks

  # --------------------------------------------------------------------------
  # Coverage for BOTH layers, in one job so a single lcov capture sees the C++
  # core as exercised by the GoogleTest binary AND by the Python test-suite
  # (most C++ format code is reached through the pybind11 shims, so measuring
  # only the gtest binary would badly under-report it).
  #
  # This works because pyproject.toml pins a persistent
  # `build-dir = "build/{wheel_tag}"`: the .gcno/.gcda files survive the pip
  # build instead of being discarded with a temporary directory.
  # --------------------------------------------------------------------------
  coverage:
    name: Coverage (Python + C++)
    needs: [lint]
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in step-level `if:` expressions
    # (referencing it there makes the whole workflow file invalid and GitHub
    # runs NOTHING — zero checks on the PR). Hoist the token into a job-level
    # env var, which step `if:`s may test via the `env` context.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive  # vendored Eigen (MED transpose)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native libraries and lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev liblzma-dev libtbb-dev lcov

      - name: Install build and test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-codeblocks pytest-cov h5py netCDF4 pybind11 scikit-build-core cmake ninja

      - name: Build and run the C++ tests (instrumented)
        run: |
          cmake -S . -B build-cpp-cov -G Ninja \
            -DMESHIOPLUSPLUS_COVERAGE=ON \
            -DMESHIOPLUSPLUS_BUILD_TESTS=ON \
            -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPython_EXECUTABLE=$(which python)
          cmake --build build-cpp-cov
          ctest --test-dir build-cpp-cov --output-on-failure

      # SKBUILD_CMAKE_BUILD_TYPE overrides pyproject's `cmake.build-type =
      # "Release"`; -O0 keeps the gcov line mapping honest.
      - name: Build instrumented _core and run the Python tests
        env:
          CMAKE_ARGS: >-
            -DMESHIOPLUSPLUS_COVERAGE=ON
            -DMESHIOPLUSPLUS_WITH_HDF5=ON
            -DMESHIOPLUSPLUS_WITH_NETCDF=ON
            -DMESHIOPLUSPLUS_WITH_ZLIB=ON
          SKBUILD_CMAKE_BUILD_TYPE: Debug
        run: |
          pip install --no-build-isolation -e . --verbose
          pytest tests/ --codeblocks --cov meshioplusplus --cov-report xml --cov-report term

      # lcov 2.x (ubuntu-latest) is strict about gcov edge cases that are not
      # actionable here -- notably `mismatch` from TUs compiled once but linked
      # into two binaries, and `unused` from the --remove patterns.
      - name: Capture C++ coverage
        run: |
          lcov --capture --gcov-tool gcov \
               --directory build-cpp-cov --directory build \
               --output-file cpp-coverage.info \
               --ignore-errors mismatch,unused,empty,gcov,negative
          lcov --remove cpp-coverage.info \
               '*/cpp/third_party/*' '*/_deps/*' '/usr/*' \
               --output-file cpp-coverage.info \
               --ignore-errors unused
          lcov --list cpp-coverage.info

      # The uploads are skipped outright until CODECOV_TOKEN is configured, so a
      # repo without it still gets the tests + the lcov summary above rather than
      # a red build. Once the token exists they are fail-loud on purpose: a
      # silently-dropped upload is what leaves the README badge stuck on
      # "unknown".
      - name: Warn if CODECOV_TOKEN is unset
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: |
          echo "::warning title=Coverage not uploaded::CODECOV_TOKEN is not set, so coverage was measured but not uploaded and the README badge will stay 'unknown'. Enable the repo on codecov.io and add the CODECOV_TOKEN secret."

      - name: Upload Python coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: true

      - name: Upload C++ coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cpp-coverage.info
          flags: cpp
          fail_ci_if_error: true
