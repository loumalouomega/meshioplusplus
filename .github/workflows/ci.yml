name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ABI staleness gate below diffs the installed headers against the
          # previous release tag, so it needs tags and history. Without this it
          # degrades to a no-op that passes vacuously -- exactly the kind of
          # silently-inert check this whole change exists to stop shipping.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Needs neither a TeX install nor a build: it regenerates the icon module
      # in memory from the committed SVGs and diffs, and checks that the .tex,
      # .svg and .ts sets are in step. See doc/icons/README.md.
      - name: Icons are current and well-formed
        run: node doc/icons/check-icons.mjs
      # Keeps MESHIOPLUSPLUS_ABI_VERSION honest: an installed header changed
      # since the last release tag, the ABI version did not, and doc/abi_reviews.md
      # records no additive review => red. Needs no build, hence the lint job.
      # See doc/abi.md for the tiers; tests/cpp/test_abi_layout.cpp is the other
      # half (it catches layout changes mechanically, this catches ODR ones).
      - name: ABI version is not stale
        run: bash tools/check-abi-version.sh

  cpp-tests:
    name: C++ tests (${{ matrix.mesh }} mesh / ${{ matrix.parallel }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two historical parallel-backend legs (MESHIO mesh + Python
        # extension) plus one leg per non-default mesh backend (standalone,
        # no pybind11 -- the CMake FATAL_ERROR forbids Python with them).
        # The STL leg builds with the nlohmann/json submodule compiled OUT
        # (-DMESHIOPLUSPLUS_WITH_JSON=OFF) so the pipeline throws-by-name gtest
        # actually fires in CI (the KaHIP "named not-built error" precedent).
        include:
          - { mesh: MESHIO, parallel: STL,    python: ON,  json: OFF }
          - { mesh: MESHIO, parallel: OPENMP, python: ON,  json: ON }
          - { mesh: NATIVE, parallel: OPENMP, python: OFF, json: ON }
          - { mesh: KRATOS, parallel: OPENMP, python: OFF, json: ON }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive  # vendored Eigen (MED transpose)
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev libtbb-dev gfortran pkg-config
      - name: Install build tools
        run: python -m pip install --upgrade pip pybind11 cmake ninja
      # Every leg also builds the C API + Fortran module, so the gtest C-API
      # suite and the fortran_api ctest run once per mesh backend.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DMESHIOPLUSPLUS_BUILD_TESTS=ON
          -DMESHIOPLUSPLUS_BUILD_C_API=ON
          -DMESHIOPLUSPLUS_BUILD_FORTRAN=ON
          -DMESHIOPLUSPLUS_MESH_BACKEND=${{ matrix.mesh }}
          -DMESHIOPLUSPLUS_PARALLEL_BACKEND=${{ matrix.parallel }}
          -DMESHIOPLUSPLUS_BUILD_PYTHON=${{ matrix.python }}
          -DMESHIOPLUSPLUS_WITH_JSON=${{ matrix.json }}
          -DPython_EXECUTABLE=$(which python)
          -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
      - name: Build
        run: cmake --build build
      - name: Run C++ tests
        if: steps.lfs.outputs.available != 'false'
        run: ctest --test-dir build --output-on-failure
      # The one place the install/export/pkg-config story is actually
      # exercised end-to-end: install the C API + Fortran module, then build
      # and run the doc examples as an external consumer would (gcc via
      # pkg-config, gfortran against the installed .mod, find_package via a
      # minimal CMake project). One leg is enough.
      - name: Install + consumer smoke test
        if: matrix.mesh == 'NATIVE'
        run: |
          cmake --install build --prefix "$PWD/inst"
          export PKG_CONFIG_PATH="$PWD/inst/lib/pkgconfig"
          pkg-config --exists meshioplusplus
          # Query the version actually installed rather than hardcoding it a
          # second time -- CMakeLists.txt's project(VERSION ...) is the single
          # source of truth (see CLAUDE.md's "Version bumps"); this stays in
          # sync with it automatically.
          pkg_version="$(pkg-config --modversion meshioplusplus)"
          gcc -std=c99 doc/examples/c_api_example.c \
            $(pkg-config --cflags --libs meshioplusplus) -o /tmp/ex_c
          gfortran doc/examples/fortran_example.f90 \
            -I inst/include/meshioplusplus/fortran -L inst/lib \
            -lmeshioplusplus_fortran -lmeshioplusplus -o /tmp/ex_f
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/ex_c
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/ex_f
          mkdir -p /tmp/find-package-consumer && cd /tmp/find-package-consumer
          cat > CMakeLists.txt <<EOF
          cmake_minimum_required(VERSION 3.15)
          project(consumer LANGUAGES C)
          find_package(meshioplusplus ${pkg_version} REQUIRED)
          add_executable(ex_c $GITHUB_WORKSPACE/doc/examples/c_api_example.c)
          target_link_libraries(ex_c PRIVATE meshioplusplus::meshioplusplus)
          EOF
          cmake -S . -B build -Dmeshioplusplus_DIR="$GITHUB_WORKSPACE/inst/lib/cmake/meshioplusplus"
          cmake --build build
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/inst/lib" ./build/ex_c
      # The templated Kratos bridge promises to populate a real Kratos-like
      # ModelPart. Compile a TU against the actual CoSimIO headers (fetched at
      # CI time only -- CoSimIO's BSD-4-clause license is never vendored into
      # this MIT repo) to catch API drift. One leg is enough.
      - name: Bridge compile-check vs CoSimIO headers
        if: matrix.mesh == 'KRATOS'
        run: |
          git clone --depth 1 https://github.com/KratosMultiphysics/CoSimIO.git /tmp/CoSimIO
          # co_sim_io_api.hpp is generated by CoSimIO's CMake configure
          # (generate_export_header), so a fresh clone doesn't have it. This
          # is a header-only compile check with no library to link, so a
          # no-op stub of the export macros is all define.hpp needs.
          if [ ! -f /tmp/CoSimIO/co_sim_io/includes/co_sim_io_api.hpp ]; then
            cat > /tmp/CoSimIO/co_sim_io/includes/co_sim_io_api.hpp <<'EOF'
          #ifndef CO_SIM_IO_API_H
          #define CO_SIM_IO_API_H
          #define CO_SIM_IO_API
          #define CO_SIM_IO_NO_EXPORT
          #define CO_SIM_IO_DEPRECATED
          #define CO_SIM_IO_DEPRECATED_EXPORT
          #define CO_SIM_IO_DEPRECATED_NO_EXPORT
          #endif
          EOF
          fi
          cat > /tmp/bridge_check.cpp <<'EOF'
          // Compile-only check: the header-only bridge + the real CoSimIO
          // ModelPart headers coexist and the bridge's creation calls match
          // a CoSimIO-like surface (CoSimIO's CreateNewElement takes an
          // ElementType enum, so it goes through a thin adapter -- exactly
          // what doc/cpp_backends.md documents for real-Kratos use).
          #include "includes/model_part.hpp"
          #include "meshioplusplus/kratos_bridge.hpp"
          int main() {
              meshioplusplus::ModelPart src("Main");
              src.CreateNewNode(1, 0.0, 0.0, 0.0);
              src.CreateNewNode(2, 1.0, 0.0, 0.0);
              src.CreateNewNode(3, 0.0, 1.0, 0.0);
              src.CreateNewElement("Element2D3N", 1, {1, 2, 3});
              CoSimIO::ModelPart dest("dest");
              for (const auto& r_node : src.Nodes())
                  dest.CreateNewNode(static_cast<CoSimIO::IdType>(r_node.Id()), r_node.X(),
                                     r_node.Y(), r_node.Z());
              for (const auto& r_elem : src.Elements()) {
                  CoSimIO::ConnectivitiesType conn(r_elem.NodeIds().begin(),
                                                   r_elem.NodeIds().end());
                  dest.CreateNewElement(static_cast<CoSimIO::IdType>(r_elem.Id()),
                                        CoSimIO::ElementType::Triangle2D3, conn);
              }
              return dest.NumberOfElements() == 1 ? 0 : 1;
          }
          EOF
          g++ -std=c++20 -fsyntax-only -Isrc/cpp/include -I/tmp/CoSimIO/co_sim_io \
            -I/tmp/CoSimIO/external_libraries /tmp/bridge_check.cpp
          echo "bridge compile-check OK"

  # The installable C++ API (MESHIOPLUSPLUS_INSTALL_CPP): build it, install it,
  # then consume it from tests/consumer/ as a genuinely separate CMake project
  # with the source tree unreachable. Its own job rather than a column on
  # cpp-tests because the option compiles the core a second time (once per mesh
  # backend), which would roughly double every existing leg.
  #
  # Two legs cover what actually differs:
  #   * static, all three backends -- proves one prefix serves meshio/native/
  #     kratos side by side, and that each variant's backend macro reaches the
  #     consumer's own compile.
  #   * shared, one backend -- the only configuration where symbol visibility is
  #     observable. The variants are built -fvisibility=hidden, so a public
  #     declaration missing MESHIOPLUSPLUS_API fails THIS link and nothing else.
  cpp-install:
    name: C++ API install (${{ matrix.name }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "static, all backends", backends: "MESHIO;NATIVE;KRATOS", shared: "OFF", cli: "ON", default_backend: "MESHIO" }
          - { name: "shared, meshio", backends: "MESHIO", shared: "ON", cli: "OFF", default_backend: "MESHIO" }
          # shared + KRATOS is the configuration a Kratos Multiphysics
          # application actually ships, and the only one where hidden-visibility
          # export is observable on that backend -- a missing MESHIOPLUSPLUS_API
          # is a link error here and nowhere else.
          - { name: "shared, kratos", backends: "KRATOS", shared: "ON", cli: "OFF", default_backend: "KRATOS" }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev ninja-build
      # MESHIOPLUSPLUS_BUILD_CLI on one leg: the CLI links the in-tree core
      # object library, not the new variants, so this pins that enabling the
      # install does not disturb (or get disturbed by) it.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF
          -DMESHIOPLUSPLUS_BUILD_C_API=ON
          -DMESHIOPLUSPLUS_INSTALL_CPP=ON
          "-DMESHIOPLUSPLUS_INSTALL_CPP_BACKENDS=${{ matrix.backends }}"
          -DMESHIOPLUSPLUS_BUILD_CLI=${{ matrix.cli }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DMESHIOPLUSPLUS_MESH_BACKEND=${{ matrix.default_backend }}
      - name: Build + install
        run: |
          cmake --build build
          cmake --install build --prefix "$PWD/inst"
      - name: Check installed tree shape
        run: |
          set -eux
          test -f inst/include/meshioplusplus/mesh.hpp
          test -f inst/include/meshioplusplus/registry.hpp
          test -f inst/include/meshioplusplus/kratos_bridge.hpp
          test -f inst/include/meshioplusplus/export.hpp
          # detail/ is included transitively by the public headers: an install
          # without it does not compile.
          test -d inst/include/meshioplusplus/detail
          test -d inst/include/meshioplusplus/formats
          test -d inst/include/meshioplusplus/operations
          test -d inst/include/meshioplusplus/backends
          test -f inst/include/meshioplusplus/meshioplusplus.h      # the C header
          test -f inst/lib/cmake/meshioplusplus/meshioplusplusConfig.cmake
          test -f inst/lib/cmake/meshioplusplus/FindKaHIP.cmake
          test -f inst/lib/pkgconfig/meshioplusplus.pc
          test -f inst/lib/pkgconfig/meshioplusplus-cxx.pc
          if [ "${{ matrix.cli }}" = "ON" ]; then test -x inst/bin/meshioplusplus; fi
          for b in $(echo "${{ matrix.backends }}" | tr ';' ' '); do
            lc=$(echo "$b" | tr '[:upper:]' '[:lower:]')
            ls inst/lib/libmeshioplusplus_core_"$lc".* >/dev/null
          done
          # Nothing from the build tree, the vendored third-party sources or the
          # test scaffolding may leak into the prefix.
          ! find inst \( -iname '*polyscope*' -o -iname '*gtest*' \
                         -o -iname 'pugixml*' -o -iname 'Eigen' \) | grep .
      - name: pkg-config
        run: |
          set -eux
          export PKG_CONFIG_PATH="$PWD/inst/lib/pkgconfig"
          # The C API's .pc must stay valid for a plain-C compile: no -std=c++20,
          # no backend macro. Compiling the C example with -std=c99 is the check.
          gcc -std=c99 doc/examples/c_api_example.c \
            $(pkg-config --cflags --libs meshioplusplus) -o /tmp/ex_c
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/ex_c
          pkg-config --cflags meshioplusplus-cxx | grep -q -- -std=c++20
          pkg-config --cflags meshioplusplus-cxx | grep -q -- -DMESHIOPLUSPLUS_MESH_BACKEND_
      - name: Consume from a separate project
        run: |
          set -eux
          for b in $(echo "${{ matrix.backends }}" | tr ';' ' '); do
            lc=$(echo "$b" | tr '[:upper:]' '[:lower:]')
            cmake -S tests/consumer -B "/tmp/consumer-$lc" \
              -Dmeshioplusplus_DIR="$PWD/inst/lib/cmake/meshioplusplus" \
              -DMESHIOPLUSPLUS_CONSUMER_BACKEND="$lc"
            cmake --build "/tmp/consumer-$lc"
            LD_LIBRARY_PATH="$PWD/inst/lib" "/tmp/consumer-$lc/consumer_smoketest"
          done
          # ...and once through meshioplusplus::core, the default-backend alias.
          cmake -S tests/consumer -B /tmp/consumer-default \
            -Dmeshioplusplus_DIR="$PWD/inst/lib/cmake/meshioplusplus"
          cmake --build /tmp/consumer-default
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/consumer-default/consumer_smoketest
          # MESHIOPLUSPLUS_NO_STD_SPAN is ABI-neutral (it guards only the
          # <span> include and the inline NativeMesh::ConnSpan accessor) and is
          # #ifndef-guarded, so a consumer must be able to define it themselves
          # against a prefix built WITHOUT it -- which is exactly the Kratos/
          # Boost-uBLAS case. This turns that claim into a gate.
          cmake -S tests/consumer -B /tmp/consumer-nospan \
            -Dmeshioplusplus_DIR="$PWD/inst/lib/cmake/meshioplusplus" \
            -DMESHIOPLUSPLUS_CONSUMER_NO_STD_SPAN=ON
          cmake --build /tmp/consumer-nospan
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/consumer-nospan/consumer_smoketest
      # doc/cpp_api.md and README.md both print an EXACT find_package line for
      # COMPONENTS CXX. Under SameMajorVersion, EXACT is a full-string compare,
      # so a two-component request can never match a three-component install --
      # which is what both files printed through v9.1.0. Exercise the real
      # thing, and assert the docs quote a line that works.
      - name: Consume with the documented EXACT pin
        run: |
          set -eux
          export PKG_CONFIG_PATH="$PWD/inst/lib/pkgconfig"
          ver=$(pkg-config --modversion meshioplusplus)
          # (1) the full three-component version must satisfy EXACT
          cmake -S tests/consumer -B /tmp/consumer-exact \
            -Dmeshioplusplus_DIR="$PWD/inst/lib/cmake/meshioplusplus" \
            -DMESHIOPLUSPLUS_CONSUMER_EXACT_VERSION="$ver"
          cmake --build /tmp/consumer-exact
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/consumer-exact/consumer_smoketest
          # (2) major.minor must NOT -- this is exactly why the docs have to
          #     spell all three components, and this keeps that reason from
          #     rotting back into a two-component line.
          if cmake -S tests/consumer -B /tmp/consumer-exact-bad \
               -Dmeshioplusplus_DIR="$PWD/inst/lib/cmake/meshioplusplus" \
               -DMESHIOPLUSPLUS_CONSUMER_EXACT_VERSION="${ver%.*}" > /tmp/exact.log 2>&1; then
            echo "::error::'${ver%.*} EXACT' should not have been satisfied"
            cat /tmp/exact.log
            exit 1
          fi
          # (3) the docs must quote the line that actually works, verbatim, so
          #     a version bump that forgets them turns this step red.
          grep -qF "find_package(meshioplusplus $ver EXACT CONFIG REQUIRED COMPONENTS CXX)" doc/cpp_api.md
          grep -qF "find_package(meshioplusplus $ver EXACT CONFIG REQUIRED COMPONENTS CXX)" README.md
      # The backend link guard, which no CMake consumer can exercise: the macro
      # always arrives via INTERFACE_COMPILE_DEFINITIONS, and main.cpp #errors
      # without it. Only a hand-rolled compile reaches the state the guard is
      # for. Gated on KRATOS because a non-MESHIO library is what makes the
      # mismatch real, and because the deps live inside the .so there (a static
      # leg would need the whole HDF5/netCDF link line).
      - name: Backend link guard fires without the definitions
        if: matrix.default_backend == 'KRATOS'
        run: |
          set -eux
          # Negative: include path only, exactly the pkg-config / makefile
          # consumer. mesh.hpp falls through to MESHIO, so the link must fail.
          if g++ -std=c++20 -I inst/include tests/consumer/no_backend_macro.cpp \
               -L inst/lib -lmeshioplusplus_core_kratos -o /tmp/nb 2> /tmp/nb.log; then
            echo "::error::a TU with no backend macro linked against a KRATOS build"
            exit 1
          fi
          # ...and it must name the backend the TU assumed, not just emit raw
          # mangled references to whatever it happened to call.
          grep -q 'mesh_backend_is_meshio' /tmp/nb.log
          # Positive control. Without it the negative half would also pass for a
          # typo'd include path, i.e. for entirely the wrong reason.
          g++ -std=c++20 -DMESHIOPLUSPLUS_MESH_BACKEND_KRATOS -I inst/include \
            tests/consumer/no_backend_macro.cpp \
            -L inst/lib -lmeshioplusplus_core_kratos -o /tmp/nb_ok
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/nb_ok
      # The second axis: headers from one meshio++, library from another. The
      # backend guard above cannot see this -- the backend can be right while the
      # headers are stale -- and until v9.4.0 nothing did, leaving the version pin
      # as the only protection against a silent ODR/layout mismatch.
      #
      # The mismatch is staged by patching a COPY of the installed headers, which
      # is exactly what a consumer whose -I and -L point at different prefixes
      # has. MESHIOPLUSPLUS_ABI_VERSION is deliberately not -D-overridable, since
      # a knob to change it would be a knob to silence the guard.
      - name: ABI version guard fires on mismatched headers
        if: matrix.default_backend == 'KRATOS'
        run: |
          set -eux
          abi=$(sed -n 's/^#define[[:space:]]\+MESHIOPLUSPLUS_ABI_VERSION[[:space:]]\+\([0-9]\+\).*/\1/p' \
                  inst/include/meshioplusplus/abi_version.hpp)
          test -n "$abi"
          # The installed SOVERSION must BE that number -- the dynamic linker's
          # half of the contract, and the reason the filename means something.
          test -e "inst/lib/libmeshioplusplus_core_kratos.so.$abi"
          # ...while the C library's stays 0. Its contract did not change.
          test -e inst/lib/libmeshioplusplus.so.0
          # Negative: a consumer holding headers that declare a different ABI.
          cp -r inst/include /tmp/stale_include
          sed -i "s/MESHIOPLUSPLUS_ABI_VERSION $abi/MESHIOPLUSPLUS_ABI_VERSION 99/" \
            /tmp/stale_include/meshioplusplus/abi_version.hpp
          if g++ -std=c++20 -DMESHIOPLUSPLUS_MESH_BACKEND_KRATOS -I /tmp/stale_include \
               tests/consumer/abi_mismatch.cpp \
               -L inst/lib -lmeshioplusplus_core_kratos -o /tmp/abi_bad 2> /tmp/abi.log; then
            echo "::error::a TU compiled against ABI-99 headers linked against an ABI-$abi library"
            exit 1
          fi
          # It must name the version the TU expected, not emit raw mangled
          # references to whatever it happened to call.
          grep -q 'abi_version_is_99' /tmp/abi.log
          # Positive control, same shape as the backend guard's: without it the
          # negative half would pass for a typo'd include path.
          g++ -std=c++20 -DMESHIOPLUSPLUS_MESH_BACKEND_KRATOS -I inst/include \
            tests/consumer/abi_mismatch.cpp \
            -L inst/lib -lmeshioplusplus_core_kratos -o /tmp/abi_ok
          LD_LIBRARY_PATH="$PWD/inst/lib" /tmp/abi_ok
          # The guard must not be INERT. This is the v9.1.0 lesson made a gate:
          # the backend guard shipped for a full release emitting no relocation at
          # all, and passed every test anyone had written, because nobody looked
          # for the reference itself.
          g++ -std=c++20 -DMESHIOPLUSPLUS_MESH_BACKEND_KRATOS -I inst/include \
            -c tests/consumer/abi_mismatch.cpp -o /tmp/abi_ok.o
          nm -uC /tmp/abi_ok.o | grep -q "abi_version_is_$abi"
      # COMPONENTS must genuinely gate: this install has no Fortran, so asking
      # for it has to fail rather than silently succeed and break at link time.
      - name: COMPONENTS enforcement
        run: |
          set -eux
          mkdir -p /tmp/neg && cd /tmp/neg
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(neg LANGUAGES CXX C)
          find_package(meshioplusplus CONFIG REQUIRED COMPONENTS CXX Fortran)
          EOF
          if cmake -S . -B b \
              -Dmeshioplusplus_DIR="$GITHUB_WORKSPACE/inst/lib/cmake/meshioplusplus" \
              > out.log 2>&1; then
            echo "::error::COMPONENTS Fortran should not have been satisfied"; cat out.log; exit 1
          fi
          echo "COMPONENTS gating OK"

  # The KaHIP partition backend. Its own dedicated job (not a matrix column)
  # so the provisioning stays out of the shared legs: no libkahip-dev package
  # exists in Ubuntu, so KaHIP v3.25 is source-built (pinned tag, PARHIP off --
  # serial kaffpa only, no MPI) and cached; meshio++'s CMake itself never
  # downloads anything (find_package via KAHIP_ROOT, the Kratos
  # KaHIPApplication lesson). The default legs above stay KaHIP-off and
  # exercise the SFC path + the named "not built" error.
  kahip:
    name: KaHIP partition backend
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev zlib1g-dev libtbb-dev pkg-config
      - name: Install build tools
        run: python -m pip install --upgrade pip pybind11 cmake ninja pytest
      - name: Cache the KaHIP install
        id: kahip-cache
        uses: actions/cache@v4
        with:
          path: ~/kahip-install
          key: kahip-v3.25-${{ runner.os }}
      - name: Build KaHIP v3.25 from source
        if: steps.kahip-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v3.25 https://github.com/KaHIP/KaHIP.git /tmp/kahip-src
          # NOMPI=ON, not just PARHIP=OFF: KaHIP's CMakeLists.txt does an
          # unconditional find_package(MPI REQUIRED) unless NOMPI is set,
          # since kaffpaE (not just ParHIP) also depends on MPI -- CI has no
          # MPI installed and we only ever link the serial kaffpa interface.
          cmake -S /tmp/kahip-src -B /tmp/kahip-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPARHIP=OFF -DNOMPI=ON -DNONATIVEOPTIMIZATIONS=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/kahip-install"
          cmake --build /tmp/kahip-build -j
          cmake --install /tmp/kahip-build
      # netCDF stays off here (the standalone-executable link quirk); the
      # cpp-tests matrix covers the netCDF formats.
      - name: Configure C++ tests with KaHIP
        run: >-
          cmake -S . -B build-kahip -G Ninja
          -DMESHIOPLUSPLUS_BUILD_TESTS=ON
          -DMESHIOPLUSPLUS_BUILD_C_API=ON
          -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF
          -DMESHIOPLUSPLUS_WITH_NETCDF=OFF
          -DMESHIOPLUSPLUS_WITH_KAHIP=ON
          -DKAHIP_ROOT=$HOME/kahip-install
      - name: Build
        run: cmake --build build-kahip
      - name: Run the partition suite (KaHIP cases live)
        if: steps.lfs.outputs.available != 'false'
        run: ctest --test-dir build-kahip -R "Partition|CApi" --output-on-failure
      - name: Install meshioplusplus with KaHIP
        run: >-
          CMAKE_ARGS="-DMESHIOPLUSPLUS_WITH_KAHIP=ON -DKAHIP_ROOT=$HOME/kahip-install"
          pip install . -v
      # KaHIP is a shared, bring-your-own library, and scikit-build-core strips
      # the RPATH from the installed `_core.so` so the wheel stays relocatable
      # ("Set non-toolchain portion of runtime path ... to ''" in the build
      # log). The ctest step above passes regardless -- it runs against the
      # build tree, whose RPATH is intact -- so the loader only fails once the
      # extension is imported from site-packages. Point it at the prefix, the
      # same way the C-API consumer smoke tests above do.
      - name: Run the Python partition suite (C++ KaHIP backend)
        if: steps.lfs.outputs.available != 'false'
        run: |
          export LD_LIBRARY_PATH="$HOME/kahip-install/lib:$HOME/kahip-install/lib64:$LD_LIBRARY_PATH"
          python -c "from meshioplusplus import _core; assert _core.__has_kahip__"
          python -m pytest tests/python/test_partition.py -v
      # The other route to the quality path: a KaHIP-less _core plus the MIT
      # `kahip` PyPI wheel -- the shim must serve method="kahip" through the
      # pure-Python dual graph + kahip.kaffpa, never the named error.
      - name: Run it again through the kahip PyPI package (pure-Python path)
        if: steps.lfs.outputs.available != 'false'
        run: |
          pip uninstall -y meshioplusplus
          pip install .
          pip install kahip
          python -c "from meshioplusplus import _core; assert not _core.__has_kahip__"
          python -m pytest tests/python/test_partition.py -v

  # The Kokkos parallel backend (host execution space) -- bring-your-own like
  # KaHIP, never picked by AUTO. Source-built from the pinned release into a
  # cached prefix; the full gtest suite doubles as the byte-identity pin (its
  # DeterministicAcrossRuns/round-trip cases must agree with every other
  # backend). A second ctest run under OMP_NUM_THREADS=2 varies the Kokkos
  # host thread pool cheaply.
  kokkos:
    name: Kokkos parallel backend
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev zlib1g-dev pkg-config
      - name: Install build tools
        run: python -m pip install --upgrade pip cmake ninja
      - name: Cache the Kokkos install
        id: kokkos-cache
        uses: actions/cache@v4
        with:
          path: ~/kokkos-install
          key: kokkos-4.5.01-pic-${{ runner.os }}
      - name: Build Kokkos 4.5.01 from source
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.5.01 https://github.com/kokkos/kokkos.git /tmp/kokkos-src
          # -DCMAKE_POSITION_INDEPENDENT_CODE=ON is required: Kokkos's static
          # archives get linked into libmeshioplusplus.so (MESHIOPLUSPLUS_BUILD_C_API),
          # and a non-PIC static archive can't go into a shared object --
          # "relocation R_X86_64_TPOFF32 ... can not be used when making a
          # shared object" from ld. meshioplusplus_core_obj itself is already
          # -fPIC (it's shared between the static test binary and the shared
          # C API lib), so anything linked into it must be too.
          cmake -S /tmp/kokkos-src -B /tmp/kokkos-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DCMAKE_CXX_STANDARD=20 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/kokkos-install"
          cmake --build /tmp/kokkos-build -j
          cmake --install /tmp/kokkos-build
      # netCDF stays off here (the standalone-executable link quirk); the
      # cpp-tests matrix covers the netCDF formats.
      - name: Configure C++ tests with the KOKKOS backend
        run: >-
          cmake -S . -B build-kokkos -G Ninja
          -DMESHIOPLUSPLUS_BUILD_TESTS=ON
          -DMESHIOPLUSPLUS_BUILD_C_API=ON
          -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF
          -DMESHIOPLUSPLUS_WITH_NETCDF=OFF
          -DMESHIOPLUSPLUS_PARALLEL_BACKEND=KOKKOS
          -DKokkos_DIR=$HOME/kokkos-install/lib/cmake/Kokkos
      - name: Build
        run: cmake --build build-kokkos
      - name: Run the full suite
        if: steps.lfs.outputs.available != 'false'
        run: ctest --test-dir build-kokkos --output-on-failure
      - name: Run it again with a 2-thread Kokkos host pool
        if: steps.lfs.outputs.available != 'false'
        run: OMP_NUM_THREADS=2 ctest --test-dir build-kokkos --output-on-failure

  # Include hygiene: fail the PR on any UNUSED #include (clang-tidy's
  # misc-include-cleaner, driven by tools/include-cleanup.sh). Missing-include
  # suggestions are advisory only -- see the script + .clang-tidy. HDF5/netCDF
  # are installed so the guarded format TUs are analyzed too (otherwise their
  # headers look spuriously unused).
  include-cleanup:
    name: Include hygiene (clang-tidy include-cleaner)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang-tidy + native libraries
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y clang-tidy libhdf5-dev libnetcdf-dev zlib1g-dev
      - name: Install build tools
        run: python -m pip install --upgrade pip cmake ninja
      - name: Check includes
        run: ./tools/include-cleanup.sh --check

  # Regenerate the committed single-header amalgamation and fail if it is stale,
  # then smoke-compile it (declarations-only, MESHIOPLUSPLUS_IMPLEMENTATION, and
  # a two-TU link) so a change under src/cpp/ that breaks the header-only build is
  # caught here. pugixml is committed under src/cpp/third_party (not a submodule),
  # so no LFS/submodule checkout is needed.
  amalgamation:
    name: Single-header amalgamation
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate + smoke-compile the single header
        run: ./tools/amalgamate.sh --smoke
      - name: Fail if the committed single header is stale
        run: |
          git diff --exit-code src/single_include/ \
            || { echo '::error::src/single_include/ is out of date -- run ./tools/amalgamate.sh and commit.'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: meshioplusplus-single-header
          path: src/single_include/meshioplusplus/meshioplusplus.hpp

  test:
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive  # vendored Eigen (MED transpose)
      # shell: bash explicitly: this job also runs on windows-latest, whose
      # default shell is pwsh, but Git Bash (bundled with Git for Windows) is
      # on PATH there and both of these steps are plain POSIX shell.
      - name: Compute the Git LFS cache key
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red.
      - name: Fetch Git LFS content
        id: lfs
        shell: bash
        run: bash tools/fetch-lfs.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # System HDF5/netCDF/zlib light up the native C++ paths.  When they are
      # absent (Windows), the h5py/netCDF4 Python wheels and the stdlib zlib
      # keep every format working via the fallback shims, so the suite still
      # passes -- this is the same story users get on a plain `pip install`.
      - name: Install native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev liblzma-dev libtbb-dev

      - name: Install native libraries (macOS)
        if: runner.os == 'macOS'
        # libomp lets the AUTO parallel backend use OpenMP on Apple clang
        # (libc++ has no parallel STL).
        run: brew install hdf5 netcdf libomp

      # macOS 13.3+ deployment target: required for std::format (its
      # floating-point formatting symbols live in the OS libc++ dylib).
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo 'MACOSX_DEPLOYMENT_TARGET=13.3' >> "$GITHUB_ENV"

      - name: Configure build (Linux/macOS - native paths on)
        if: runner.os != 'Windows'
        shell: bash
        run: echo 'CMAKE_ARGS=-DMESHIOPLUSPLUS_WITH_HDF5=ON -DMESHIOPLUSPLUS_WITH_NETCDF=ON -DMESHIOPLUSPLUS_WITH_ZLIB=ON' >> "$GITHUB_ENV"

      - name: Configure build (Windows - Python fallbacks)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CMAKE_ARGS=-DMESHIOPLUSPLUS_WITH_HDF5=OFF -DMESHIOPLUSPLUS_WITH_NETCDF=OFF -DMESHIOPLUSPLUS_WITH_ZLIB=OFF" >> $env:GITHUB_ENV

      - name: Install meshio++ and test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-codeblocks h5py netCDF4
          pip install . --verbose

      # Coverage is not collected here -- the dedicated `coverage` job below
      # owns it, so this matrix stays focused on cross-platform correctness.
      - name: Run tests
        if: steps.lfs.outputs.available != 'false'
        run: pytest tests/python/ --codeblocks

  # --------------------------------------------------------------------------
  # Coverage for BOTH layers, in one job so a single lcov capture sees the C++
  # core as exercised by the GoogleTest binary AND by the Python test-suite
  # (most C++ format code is reached through the pybind11 shims, so measuring
  # only the gtest binary would badly under-report it).
  #
  # This works because pyproject.toml pins a persistent
  # `build-dir = "build/{wheel_tag}"`: the .gcno/.gcda files survive the pip
  # build instead of being discarded with a temporary directory.
  # --------------------------------------------------------------------------
  coverage:
    name: Coverage (Python + C++)
    needs: [lint]
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in step-level `if:` expressions
    # (referencing it there makes the whole workflow file invalid and GitHub
    # runs NOTHING — zero checks on the PR). Hoist the token into a job-level
    # env var, which step `if:`s may test via the `env` context.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive  # vendored Eigen (MED transpose)
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red. Coverage
      # is meaningless without the real fixtures, so every step below that
      # needs them (through the two upload steps) is gated on this output.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native libraries and lcov
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libnetcdf-dev zlib1g-dev liblzma-dev libtbb-dev lcov \
            libgl1 libglx-mesa0

      # pyvista/trimesh/pyarrow/pandas/polars/zarr are here (not just the
      # dedicated `interop` job) so tests/python/test_interop.py's and
      # test_ml.py's gated halves -- to_pyvista/from_pyvista/to_trimesh/
      # from_trimesh/to_arrow/from_arrow/write_parquet/read_parquet/to_pandas/
      # to_polars/write_dataset -- are exercised under coverage
      # instrumentation. The `interop` job runs the same tests but uploads no
      # coverage; without these installed here, that code is real and tested
      # but shows up as 0% in the Codecov patch check, since instrumented +
      # uploaded is the only thing that counts. torch/jax are deliberately
      # absent (heavyweight wheels; to_torch/to_jax tests importorskip -- the
      # CuPy pattern, doc/ml.md).
      # libgl1/libglx-mesa0 above are for pyvista's VTK import, not rendering.
      - name: Install build and test deps
        run: |
          python -m pip install --upgrade pip
          # `mcp<2` must match pyproject's [mcp] extra: this list installs the
          # SDK directly rather than through the extra, so the bound there does
          # NOT apply here and an unbounded `mcp` resolves 2.0.0, which removed
          # mcp.server.fastmcp. Keep the two in step.
          pip install pytest pytest-codeblocks pytest-cov h5py netCDF4 pybind11 scikit-build-core cmake ninja \
            pyvista trimesh pyarrow pandas polars zarr "mcp<2"

      # Cache the two Debug -O0 core builds (build-cpp-cov + the editable _core)
      # so re-runs reuse objects. compiler-check=content keeps hits valid across
      # runner image updates.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: coverage-${{ runner.os }}
          max-size: 500M

      - name: Build and run the C++ tests (instrumented)
        if: steps.lfs.outputs.available != 'false'
        run: |
          cmake -S . -B build-cpp-cov -G Ninja \
            -DMESHIOPLUSPLUS_COVERAGE=ON \
            -DMESHIOPLUSPLUS_BUILD_TESTS=ON \
            -DMESHIOPLUSPLUS_BUILD_C_API=ON \
            -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE=$(which python)
          cmake --build build-cpp-cov
          ctest --test-dir build-cpp-cov --output-on-failure

      # SKBUILD_CMAKE_BUILD_TYPE overrides pyproject's `cmake.build-type =
      # "Release"`; -O0 keeps the gcov line mapping honest.
      # SKBUILD_EDITABLE_REBUILD=false stops scikit-build-core from rebuilding
      # the extension on first import during pytest -- that rebuild would race
      # the instrumented objects lcov is about to capture.
      - name: Build instrumented _core and run the Python tests
        if: steps.lfs.outputs.available != 'false'
        env:
          CMAKE_ARGS: >-
            -DMESHIOPLUSPLUS_COVERAGE=ON
            -DMESHIOPLUSPLUS_WITH_HDF5=ON
            -DMESHIOPLUSPLUS_WITH_NETCDF=ON
            -DMESHIOPLUSPLUS_WITH_ZLIB=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          SKBUILD_CMAKE_BUILD_TYPE: Debug
          SKBUILD_EDITABLE_REBUILD: "false"
        run: |
          pip install --no-build-isolation -e . --verbose
          pytest tests/python/ --codeblocks --cov meshioplusplus --cov-report xml --cov-report term

      # lcov 2.x (ubuntu-latest) is strict about gcov edge cases that are not
      # actionable here and would otherwise hard-stop the capture:
      #   mismatch/inconsistent - TUs compiled once but linked into two binaries
      #     (the gtest binary and _core), and gtest headers pulled from _deps;
      #   version - gcov data version vs the gcov tool, harmless on a matched
      #     runner toolchain but fatal by default;
      #   negative - counter races surviving -fprofile-update=atomic under the
      #     threaded parallel_for loops;
      #   unused/empty/gcov/range/corrupt - byproducts of the --remove patterns
      #     and partially-covered generated code.
      # `*/build*/_deps/*` also strips FetchContent'd GoogleTest, which lands
      # under the build tree rather than a top-level _deps/.
      #
      # The non-MESHIO mesh-backend headers (native_mesh/kratos_mesh/model_part/
      # kratos_names) are never instantiated in this MESHIO-only job -- they are
      # exercised by the standalone `cpp-tests` backend matrix instead -- so
      # leaving them in would structurally cap the `cpp` number with code this
      # job cannot reach. Drop them from the denominator here (Codecov's ignore
      # list mirrors this so the badge and the log summary agree).
      - name: Capture C++ coverage
        if: steps.lfs.outputs.available != 'false'
        run: |
          lcov --capture --gcov-tool gcov \
               --directory build-cpp-cov --directory build \
               --output-file cpp-coverage.info \
               --ignore-errors mismatch,inconsistent,version,unused,empty,gcov,negative,range,corrupt
          lcov --remove cpp-coverage.info \
               '*/src/cpp/third_party/*' '*/_deps/*' '*/build*/_deps/*' '/usr/*' \
               '*/backends/native_mesh.hpp' '*/backends/kratos_mesh.hpp' \
               '*/backends/model_part.hpp' '*/backends/kratos_names.hpp' \
               '*/src/abi_version_check.cpp' '*/src/mesh_backend_check.cpp' \
               --output-file cpp-coverage.info \
               --ignore-errors unused
          lcov --list cpp-coverage.info

      # The uploads are skipped outright until CODECOV_TOKEN is configured, so a
      # repo without it still gets the tests + the lcov summary above rather than
      # a red build. Once the token exists they are fail-loud on purpose: a
      # silently-dropped upload is what leaves the README badge stuck on
      # "unknown".
      - name: Warn if CODECOV_TOKEN is unset
        if: ${{ env.CODECOV_TOKEN == '' }}
        run: |
          echo "::warning title=Coverage not uploaded::CODECOV_TOKEN is not set, so coverage was measured but not uploaded and the README badge will stay 'unknown'. Enable the repo on codecov.io and add the CODECOV_TOKEN secret."

      - name: Upload Python coverage
        if: ${{ env.CODECOV_TOKEN != '' && steps.lfs.outputs.available != 'false' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: true

      - name: Upload C++ coverage
        if: ${{ env.CODECOV_TOKEN != '' && steps.lfs.outputs.available != 'false' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cpp-coverage.info
          flags: cpp
          fail_ci_if_error: true

  # --------------------------------------------------------------------------
  # The desktop viewer backend (polyscope). Kept out of the per-backend C++
  # matrix on purpose: polyscope is a Python-only optional dependency and has
  # nothing to do with the mesh or parallel backends.
  #
  # The default `test` matrix already runs the pure mapping tests with no
  # polyscope installed, which is what covers the "not installed" error path.
  # This job adds the ones that actually render.
  # --------------------------------------------------------------------------
  viewer-python:
    name: Viewer (polyscope, headless)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # EGL is the real headless path and is what polyscope's own
      # `openGL3_egl` backend needs; xvfb + llvmpipe is the fallback for
      # runners or wheels where EGL is unavailable. `_init_polyscope` tries the
      # headless backends by name and reports which ones it tried, so whichever
      # of the two is present here, the failure mode stays legible.
      - name: Install a GL runtime
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libglx-mesa0 libegl1 libgl1-mesa-dri \
            libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1

      - name: Install meshio++ with the viewer extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[viewer]" pytest

      - name: Render tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x960x24" python -m pytest tests/python/test_viewer.py tests/python/test_cli.py -m viewer -v

  # --------------------------------------------------------------------------
  # In-memory interoperability (src/python/meshioplusplus/_interop.py).
  #
  # PyVista, trimesh and pyarrow are Python-only optional extras that never
  # reach the C++/WASM/C/Fortran core, so this is one plain pip job -- the
  # per-backend C++ matrix is deliberately untouched.
  #
  # The `test` matrix above stays clean: with none of these installed,
  # test_interop.py still runs its pure-payload half (the whole point of the
  # `_viewer`-style split) and skips the gated half via importorskip.
  #
  # test_gpu.py runs here too, but only its HOST half (pure payloads + the
  # DLPack kDLCPU round-trip): CuPy is deliberately NOT installed -- hosted
  # runners have no CUDA device, and the gated device tests need a real GPU
  # (they skip; the device path is not covered by public CI -- doc/gpu.md).
  # --------------------------------------------------------------------------
  interop:
    name: Interop (PyVista, trimesh, Arrow, pandas, polars, ML)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # vendored Eigen (MED transpose)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No rendering happens here -- building a vtkUnstructuredGrid needs no
      # display -- but the VTK wheel PyVista pulls in wants libGL at import.
      - name: Install a GL runtime
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglx-mesa0

      - name: Install meshio++ with the interop and zarr extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[interop,zarr]" pytest

      - name: Interop and ML tests
        run: python -m pytest tests/python/test_interop.py tests/python/test_gpu.py tests/python/test_ml.py -v

  # --------------------------------------------------------------------------
  # The MCP server with its extra installed. The default `test` matrix keeps
  # exercising test_mcp.py's pure half (the payload layer, the sandbox, the
  # parity guard) with the `mcp` SDK absent -- that split is the point; this
  # job adds the gated half: FastMCP registration, tool calls, resources.
  # --------------------------------------------------------------------------
  mcp:
    name: MCP server
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # vendored Eigen (MED transpose)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install meshio++ with the mcp extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[mcp]" pytest

      - name: MCP tests
        run: python -m pytest tests/python/test_mcp.py -v

  # --------------------------------------------------------------------------
  # The Blender bridge with `bpy` installed. The default `test` matrix already
  # runs test_blender.py's pure half -- the payload layer, the pure inverse,
  # the attribute typing, the not-installed error path -- with no bpy at all;
  # that split is the point. This job adds the half only a real Blender data
  # model can settle, chiefly `mesh.validate()` as a topology oracle.
  #
  # Python is pinned to 3.11, not 3.12: the `bpy` PyPI wheel is built against
  # the exact CPython minor Blender embeds (3.11 for the 4.2 LTS line), so
  # there is no cp312 wheel to install. When Blender moves to 3.12 this pin and
  # the extension's bundled wheels move together.
  #
  # Honest cost: that wheel is a few hundred MB, which makes this the slowest
  # of the Python jobs.
  # --------------------------------------------------------------------------
  blender:
    name: Blender bridge (bpy)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # vendored Eigen (MED transpose)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # bpy links against a full GL/X11 stack even when nothing is rendered.
      - name: Install the runtime libraries bpy needs
        run: |
          # packages.microsoft.com ships preinstalled on the ubuntu-latest
          # runner image and this repo never uses it; when that repo 403s it
          # aborts `apt-get update` under the default `-e` shell before the
          # packages we actually need are ever fetched. Strip it first.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libegl1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libxkbcommon0 libsm6 libice6

      - name: Install meshio++ and bpy
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
          pip install "bpy==4.2.*"

      - name: Blender bridge tests
        run: python -m pytest tests/python/test_blender.py -v

  # --------------------------------------------------------------------------
  # The browser viewer. Lives here rather than in wasm.yml because that
  # workflow only triggers on v* tags, and this needs to run on every PR that
  # could break the app.
  #
  # The Emscripten build is not optional: src/wasm/dist/ is gitignored, so the
  # package the viewer consumes does not exist until it is built. And npm
  # *copies* a `file:` dependency, so `npm ci` has to come after that build --
  # vite.config.mjs fails loudly if this order is ever broken.
  # --------------------------------------------------------------------------
  viewer-web:
    name: Viewer (browser, Playwright)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.3"

      - name: Build the meshio++ WASM package
        run: ./build/configure-wasm.sh --build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/viewer/package-lock.json

      - name: WASM smoke test
        run: node tests/wasm/smoke.mjs

      # Must come before typecheck/lint/unit-tests below -- they all need
      # node_modules (including the @meshioplusplus/wasm file: dependency
      # this npm ci copies in from the just-built src/wasm/dist/).
      - name: Install viewer dependencies
        working-directory: src/viewer
        run: npm ci

      - name: Type-check the viewer
        working-directory: src/viewer
        run: npm run typecheck

      # The one lint rule worth a job of its own. Every vtk.js typing gap is
      # meant to go through vtk-augmentations.d.ts or vtk-shims.ts, where it
      # stays checked; `as any` would quietly opt out of the whole migration.
      - name: No `as any` in viewer sources
        run: |
          if grep -rn ' as any' src/viewer/src --include='*.ts'; then
            echo "use vtk-augmentations.d.ts or vtk-shims.ts instead" >&2
            exit 1
          fi

      - name: Unit tests (colour maps)
        working-directory: src/viewer
        run: npm run test:unit

      - name: Build the viewer
        working-directory: src/viewer
        run: |
          npm run build:web
          npm run build:embed

      - name: The web build ships both pages
        run: |
          test -f src/viewer/dist-web/index.html
          test -f src/viewer/dist-web/dataset.html

      - name: The embedded build is a single self-contained file
        run: |
          test "$(ls src/viewer/dist-embed | wc -l)" -eq 1
          # All three payload slots Python fills. Matched as exact strings on
          # the Python side, so singlefile mangling one must fail here rather
          # than at view() time.
          grep -q 'id="vtp-payload"' src/viewer/dist-embed/index.html
          grep -q 'id="stats-payload"' src/viewer/dist-embed/index.html
          grep -q 'id="view-config"' src/viewer/dist-embed/index.html
          # It must never carry WebAssembly: Python writes the payload, so the
          # page only renders. Dead-code elimination alone did not achieve this
          # (Vite's worker plugin emits chunks at transform time), so assert it.
          ! grep -q '\.wasm' src/viewer/dist-embed/index.html

      # Size drift alone cannot catch the failure that matters most -- the
      # WASM binary returning under a differently-named chunk, or a heavy
      # dependency being re-imported -- so cap the absolute size too.
      - name: The viewer stays within its size budget
        run: |
          python - <<'PY'
          import pathlib, sys
          caps = {
              "src/viewer/dist-embed/index.html": 2_000_000,
              "src/viewer/dist-web/assets": 4_000_000,
          }
          embed = pathlib.Path("src/viewer/dist-embed/index.html").stat().st_size
          if embed > caps["src/viewer/dist-embed/index.html"]:
              sys.exit(f"dist-embed/index.html is {embed} bytes, over the 2 MB budget")
          print(f"ok: dist-embed/index.html {embed} bytes")
          PY

      # Structural, not a byte comparison: Rollup output is not reproducible
      # across npm patch releases, so a `git diff --exit-code` here would be a
      # recurring red build unrelated to any change of ours. A 10% size drift
      # still catches "added a feature and forgot to re-copy".
      - name: The committed wheel asset is current
        run: |
          python - <<'PY'
          import pathlib, sys
          fresh = pathlib.Path("src/viewer/dist-embed/index.html").stat().st_size
          committed = pathlib.Path(
              "src/python/meshioplusplus/_viewer_assets/viewer.html"
          ).stat().st_size
          drift = abs(fresh - committed) / max(fresh, committed)
          if drift > 0.10:
              sys.exit(
                  f"the committed viewer asset looks stale: {committed} bytes vs "
                  f"{fresh} freshly built ({drift:.0%} drift). Regenerate it:\n"
                  "  cd src/viewer && npm run build:embed\n"
                  "  cp dist-embed/index.html ../python/meshioplusplus/_viewer_assets/viewer.html"
              )
          PY

      - name: Install Playwright
        working-directory: src/viewer
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke test
        working-directory: src/viewer
        run: npm run test:e2e

      # The offline page Python generates must actually render. Nothing else
      # checks that the committed asset works rather than merely existing.
      - name: The wheel-bundled offline page renders
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "
          import pathlib, meshioplusplus as m
          from meshioplusplus._viewer_browser import build_page
          mesh = m.read('src/viewer/public/samples/block.vtu')
          pathlib.Path('/tmp/offline.html').write_text(build_page(mesh, title='offline'))
          # The quality path bakes ~10 arrays in; it must still render.
          pathlib.Path('/tmp/offline-quality.html').write_text(
              build_page(mesh, title='offline', quality=True))
          "
          cd src/viewer
          npx playwright test offline.spec.mjs
          VIEWER_OFFLINE_PAGE=/tmp/offline-quality.html npx playwright test offline.spec.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/viewer/playwright-report

  # --------------------------------------------------------------------------
  # The viewer asset ships as package data. scikit-build-core's
  # `wheel.packages` copies it with no extra configuration -- which is exactly
  # why a regression here would be silent.
  # --------------------------------------------------------------------------
  viewer-packaging:
    name: Viewer asset ships in the wheel
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a wheel and check its contents
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          asset = "meshioplusplus/_viewer_assets/viewer.html"
          if asset not in names:
              sys.exit(f"{asset} is missing from {wheel}")
          print(f"ok: {asset} ships in {wheel}")
          PY

  # --------------------------------------------------------------------------
  # The Blender extension zip. The `viewer-packaging` shape: build the artifact
  # and assert its structure, rather than trusting anyone to remember.
  #
  # The manifest is *generated*, so its version cannot drift from
  # pyproject.toml by hand -- but the generator could, and the wheel file names
  # it embeds carry the version too. This job is what makes that machine-checked.
  #
  # `--local-wheel`, never PyPI: on a PR that bumps the version, the wheel the
  # manifest must name does not exist on PyPI yet.
  # --------------------------------------------------------------------------
  blender-packaging:
    name: Blender extension zip is well-formed
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # vendored Eigen (MED transpose)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel and the extension zip
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python src/blender/build_extension.py --platform linux-x64 \
                 --local-wheel 'dist/*.whl' --outdir dist

      - name: Check the zip's contents and manifest
        run: |
          python - <<'PY'
          import glob, pathlib, sys, tomllib, zipfile

          archive = zipfile.ZipFile(sorted(glob.glob("dist/*.zip"))[-1])
          names = set(archive.namelist())
          for required in ("blender_manifest.toml", "__init__.py", "operators.py",
                           "formats.py", "LICENSE"):
              if required not in names:
                  sys.exit(f"{required} is missing from the extension zip")

          manifest = tomllib.loads(archive.read("blender_manifest.toml").decode())
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if manifest["version"] != version:
              sys.exit(f'manifest {manifest["version"]} != pyproject {version}')

          listed = {w.lstrip("./") for w in manifest["wheels"]}
          present = {n for n in names if n.startswith("wheels/")}
          if listed != present:
              sys.exit(f"manifest/zip wheel mismatch: {listed ^ present}")

          # meshioplusplus needs the compiled _core, and `rich` is a hard
          # runtime dependency because __init__.py imports _cli eagerly.
          if not any(f"meshioplusplus-{version}-cp311-" in n for n in present):
              sys.exit(f"no cp311 meshioplusplus-{version} wheel in {sorted(present)}")
          if not any(n.startswith("wheels/rich-") for n in present):
              sys.exit("rich must be bundled: meshioplusplus/__init__.py imports _cli")
          print("ok:", sorted(present))
          PY

  # --------------------------------------------------------------------------
  # The CLI's optional native viewer. Lives here rather than in cli.yml because
  # that workflow builds the *release* binaries, which must stay dependency-free
  # -- Polyscope pulls in OpenGL, GLFW and X11. Its `ldd` assertion is what
  # proves the flag stayed off there; this job is what proves it works when on.
  #
  # Note `submodules: recursive`: Polyscope vendors its own (glfw, imgui, glm,
  # ...), and with a plain --init the CMake EXISTS guard silently leaves the
  # viewer out, which would make this job pass while testing nothing.
  # --------------------------------------------------------------------------
  cli-polyscope:
    name: CLI native viewer (Polyscope)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh. The screenshot/CLI-flag steps below use the
      # LFS-EXEMPT src/viewer/public/samples/block.vtu (.gitattributes), so
      # only the ctest step, which may reach committed gtest fixtures, needs
      # to be gated.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the GL/X11 stack Polyscope needs
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libglu1-mesa-dev libgl1-mesa-dev libegl1 libgl1-mesa-dri xvfb
      - name: Install build tools
        run: python -m pip install --upgrade pip cmake ninja

      # netCDF stays off (the standalone-executable link quirk); the cpp-tests
      # matrix covers those formats.
      - name: Configure with the viewer
        run: >-
          cmake -S . -B build-view -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF
          -DMESHIOPLUSPLUS_BUILD_CLI=ON
          -DMESHIOPLUSPLUS_BUILD_TESTS=ON
          -DMESHIOPLUSPLUS_WITH_NETCDF=OFF
          -DMESHIOPLUSPLUS_WITH_POLYSCOPE=ON
      - name: Build
        run: cmake --build build-view

      # The payload invariants need no GL and also run in the default build --
      # running them here too catches a Polyscope-only compilation divergence.
      - name: Payload invariants
        if: steps.lfs.outputs.available != 'false'
        run: ctest --test-dir build-view -R ViewPayload --output-on-failure

      - name: The viewer is really compiled in
        run: |
          ./build-view/meshioplusplus --help | grep -q '^  view '
          # Without the flag this reports the flag instead of rendering, so a
          # silent EXISTS-guard miss would be caught right here.
          ! ./build-view/meshioplusplus view src/viewer/public/samples/block.vtu 2>&1 \
            | grep -q 'MESHIOPLUSPLUS_WITH_POLYSCOPE'

      - name: Headless screenshot
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24" \
            ./build-view/meshioplusplus screenshot src/viewer/public/samples/block.vtu \
            /tmp/cli.png --size 320x240
          python - <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path("/tmp/cli.png").read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit("not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (320, 240):
              sys.exit(f"expected 320x240, got {width}x{height}")
          print(f"ok: {len(data)} byte PNG at {width}x{height}")
          PY

  # The Julia binding (bindings/julia/), which consumes the INSTALLED C API
  # exactly as an external user would -- the same shape as the "Install +
  # consumer smoke test" step of the cpp-tests NATIVE leg above. No C++ of its
  # own is compiled here.
  #
  # netCDF stays off (the standalone-executable link quirk); the cpp-tests
  # matrix covers those formats.
  julia:
    name: Julia binding
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive  # vendored Eigen (MED transpose)
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Install native libraries
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Install build tools
        run: python -m pip install --upgrade pip cmake ninja

      # HDF5 and netCDF are both off, not just netCDF: Debian/Ubuntu's
      # libhdf5-dev pulls in libhdf5_openmpi, which links the system libcurl.
      # Julia bundles its own libcurl, and an IJulia kernel subprocess's
      # dlopen of a HDF5-linked libmeshioplusplus.so mixes the two, failing
      # with "libcurl.so.4: version `CURL_OPENSSL_4' not found" -- a real
      # Debian/Ubuntu + Julia interaction, not a meshio++ bug, confirmed by
      # building the C API with HDF5 on vs. off. None of these formats are
      # needed to test the binding itself.
      - name: Build and install the C API
        run: |
          cmake -S . -B build-capi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF \
            -DMESHIOPLUSPLUS_BUILD_C_API=ON \
            -DMESHIOPLUSPLUS_WITH_HDF5=OFF \
            -DMESHIOPLUSPLUS_WITH_NETCDF=OFF
          cmake --build build-capi
          cmake --install build-capi --prefix "$PWD/inst"

      # MESHIOPLUSPLUS_LIB is the package's first discovery route; the loader
      # path is the fallback. Setting both exercises the documented primary one
      # while keeping any dependent .so resolvable.
      - name: Run the test suite
        if: steps.lfs.outputs.available != 'false'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/inst/lib
        run: |
          export MESHIOPLUSPLUS_LIB="$PWD/inst/lib/libmeshioplusplus.so"
          julia --project=bindings/julia/MeshioPlusPlus -e 'using Pkg; Pkg.test()'

      - name: Run the doc example
        if: steps.lfs.outputs.available != 'false'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/inst/lib
        run: |
          export MESHIOPLUSPLUS_LIB="$PWD/inst/lib/libmeshioplusplus.so"
          julia --project=bindings/julia/MeshioPlusPlus doc/examples/julia_example.jl

      # The package must fail with a message naming how to build the library,
      # not with an opaque dlopen error, when it cannot find one.
      - name: A missing library fails by name
        run: |
          julia --project=bindings/julia/MeshioPlusPlus -e '
            try
              using MeshioPlusPlus
              error("expected loading to fail without the library")
            catch err
              msg = sprint(showerror, err)
              occursin("configure.sh --c-api", msg) || error("unhelpful error:\n" * msg)
              println("ok: failed by name")
            end'

  # The R binding (bindings/r/), against the same installed prefix. `R CMD
  # check --as-cran` is the real quality gate for an R package, so that is what
  # runs rather than a bare test invocation.
  r:
    name: R binding
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # See tools/fetch-lfs.sh: this degrades gracefully (available=false,
      # not a failure) when the account's Git LFS budget is exhausted, so a
      # billing condition does not turn an unrelated PR's CI red.
      - name: Fetch Git LFS content
        id: lfs
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # testthat is the package's only dependency (no Imports at all), so it is
      # installed directly rather than through setup-r-dependencies, which would
      # resolve a DESCRIPTION whose configure step needs a C library that does
      # not exist yet at this point in the job.
      - name: Install testthat
        run: install.packages("testthat")
        shell: Rscript {0}
      - name: Install native libraries
        run: |
          # packages.microsoft.com (azure-cli / MS-prod) ships preinstalled on
          # the ubuntu-latest runner image and this repo never uses it; when
          # that repo 403s or "is no longer signed" (a recurring GitHub
          # runner-image issue, unrelated to any change here), it aborts
          # `apt-get update` under the default `-e` shell before the packages
          # we actually need are ever fetched. Strip it first rather than
          # letting an unused third-party source take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev zlib1g-dev pkg-config
      - name: Install build tools
        run: python -m pip install --upgrade pip cmake ninja

      - name: Build and install the C API
        run: |
          cmake -S . -B build-capi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF \
            -DMESHIOPLUSPLUS_BUILD_C_API=ON \
            -DMESHIOPLUSPLUS_WITH_NETCDF=OFF
          cmake --build build-capi
          cmake --install build-capi --prefix "$PWD/inst"

      # pkg-config is the package's first discovery route (the relocatable .pc
      # the C API installs); MESHIOPLUSPLUS_HOME is the documented fallback.
      - name: R CMD check --as-cran
        if: steps.lfs.outputs.available != 'false'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/inst/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/inst/lib
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: |
          pkg-config --exists meshioplusplus
          R CMD build bindings/r/meshioplusplus
          # A LaTeX-less runner cannot build the PDF manual, and that failure
          # says nothing about the package.
          R CMD check --as-cran --no-manual meshioplusplus_*.tar.gz

      - name: Show the check log
        if: always()
        run: cat meshioplusplus.Rcheck/00check.log || true

      - name: Install and run the doc example
        if: steps.lfs.outputs.available != 'false'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/inst/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/inst/lib
        run: |
          R CMD INSTALL bindings/r/meshioplusplus
          Rscript doc/examples/r_example.R

      # The configure script must explain how to build the library rather than
      # failing with a bare compiler error.
      - name: A missing library fails by name
        run: |
          cd bindings/r/meshioplusplus
          if env -u PKG_CONFIG_PATH -u MESHIOPLUSPLUS_HOME ./configure 2>err.log; then
            echo "expected configure to fail without the library" && exit 1
          fi
          grep -q 'configure.sh --c-api' err.log
          echo "ok: failed by name"
