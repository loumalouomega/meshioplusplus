name: fuzz

# Coverage-guided fuzzing of every native registry reader (doc/fuzzing.md).
# Scheduled rather than per-PR: a campaign is minutes per format, and what it
# finds is a new input to fix, not a regression in the change under review.
# The regressions it has found are replayed on every PR by the cpp-tests and
# cpp-sanitize jobs (ctest's fuzz_regression_<format> tests).
on:
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per format"
        default: "60"
  pull_request:
    paths:
      - "tests/fuzz/**"
      - "tools/fuzz/**"
      - "CMakeLists.txt"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: Fuzz instrumented HDF5 and netCDF readers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build
      - name: Build instrumented dependencies and fuzz targets
        env:
          CC: clang
          CXX: clang++
          JOBS: "4"
        run: |
          prefix="$RUNNER_TEMP/fuzz-deps"
          bash tools/fuzz/build_library_deps.sh "$prefix"
          cmake -S . -B build-library-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$prefix" -DHDF5_ROOT="$prefix" -DZLIB_ROOT="$prefix" \
            -DMESHIOPLUSPLUS_BUILD_FUZZERS=ON -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF \
            -DMESHIOPLUSPLUS_WITH_GIDPOST=OFF -DMESHIOPLUSPLUS_PARALLEL_BACKEND=SEQ
          cmake --build build-library-fuzz --parallel 4 \
            --target meshioplusplus_fuzz_hdf5 meshioplusplus_fuzz_replay meshioplusplus_fuzz_mutator_probe
          # Do not silently fall back to uninstrumented distribution libraries.
          ldd build-library-fuzz/meshioplusplus_fuzz_hdf5 > linked-libraries.txt
          for lib in libhdf5 libnetcdf libz.so; do
            grep "$lib" linked-libraries.txt | grep -F "$prefix/"
          done
      - name: Generate seeds
        run: |
          python -m pip install '.[all]' pytest
          formats=$(grep -v '^#' tools/fuzz/library_formats.txt | paste -sd,)
          python tools/fuzz/seed_corpus.py library-seeds --library-readers --formats "$formats" \
            --replay build-library-fuzz/meshioplusplus_fuzz_replay
      - name: Verify mutator child failures stay isolated
        env:
          MIO_FUZZ_MUTATOR_PROBE: build-library-fuzz/meshioplusplus_fuzz_mutator_probe
          ASAN_OPTIONS: detect_leaks=1:allocator_may_return_null=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python -m pytest tests/python/test_fuzz_tools.py -k native_mutator_isolation -v
      - name: Replay seeds and fuzz library objects
        env:
          MIO_FUZZ_LIBRARY_READERS: "1"
          FUZZ_BINARY: meshioplusplus_fuzz_hdf5
          MAX_LEN: "262144"
          SECONDS_PER_FORMAT: ${{ inputs.seconds || '60' }}
          ASAN_OPTIONS: detect_leaks=1:allocator_may_return_null=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          export FORMATS="$(grep -v '^#' tools/fuzz/library_formats.txt)"
          for fmt in $FORMATS; do
            build-library-fuzz/meshioplusplus_fuzz_replay -format="$fmt" "library-seeds/$fmt"
          done
          secs="$SECONDS_PER_FORMAT"
          [ "$GITHUB_EVENT_NAME" = pull_request ] && secs=10
          bash tools/fuzz/run_campaign.sh build-library-fuzz library-seeds library-findings "$secs"
      - name: Upload coverage logs and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-libraries
          path: |
            linked-libraries.txt
            library-findings/**/fuzz.log
            library-findings/**/crash-*
            library-findings/**/leak-*
            library-findings/**/timeout-*
            library-findings/**/oom-*
            library-findings/summary.txt

  fuzz:
    name: Fuzz readers (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
      - name: Compute the Git LFS cache key
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      # Seeds come from the LFS fixtures; without them the fuzzer starts from
      # empty inputs, which still works, only slower.
      - name: Fetch Git LFS content
        run: bash tools/fetch-lfs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y clang libhdf5-dev libnetcdf-dev zlib1g-dev libbz2-dev pkg-config ninja-build
      - name: Configure and build the fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMESHIOPLUSPLUS_BUILD_FUZZERS=ON -DMESHIOPLUSPLUS_BUILD_PYTHON=OFF \
            -DMESHIOPLUSPLUS_PARALLEL_BACKEND=SEQ -DMESHIOPLUSPLUS_WITH_BZIP2=ON
          cmake --build build --target meshioplusplus_fuzz_read meshioplusplus_fuzz_replay
      # The generated seeds need the Python package; the fixture seeds do not.
      - name: Install meshio++ for the generated seeds
        run: python -m pip install .
      - name: Build the seed corpora
        run: python tools/fuzz/seed_corpus.py seeds --replay build/meshioplusplus_fuzz_replay
      - name: Fuzz
        env:
          SHARD: ${{ matrix.shard }}
          NSHARDS: "4"
          ASAN_OPTIONS: detect_leaks=1:allocator_may_return_null=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          secs="${{ github.event.inputs.seconds }}"
          [ "${{ github.event_name }}" = pull_request ] && secs=10
          tools/fuzz/run_campaign.sh build seeds findings "${secs:-60}"
      - name: Job summary
        if: always()
        run: |
          echo "### Fuzz shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' findings/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.shard }}
          path: |
            findings/*/crash-*
            findings/*/leak-*
            findings/*/timeout-*
            findings/*/oom-*
            findings/*/fuzz.log
