name: packages

# Validate (and, on release tags, exercise) the self-hosted Conan recipe and
# vcpkg overlay port for the C API (libmeshioplusplus). Mirrors wheels.yml /
# wasm.yml: PRs validate, `v*` tags run the full release-shaped build.
#
# Neither package is submitted to Conan Center or the upstream vcpkg registry
# (that's a separate, heavier undertaking -- an external PR reviewed by those
# projects, plus ongoing recipe maintenance there), so nothing resolves
# `meshioplusplus` as a plain requirement out of the box. As a stopgap, `v*`
# tags attach ready-to-use package artifacts to the tag's GitHub Release: a
# Conan `cache save` archive per option set -- supplies just the recipe + one
# matching prebuilt binary; restore with `conan cache restore <file>`, then
# `conan install --requires=meshioplusplus/<version> --build=missing -o ...`
# (Conan Center still supplies the transitive hdf5/netcdf/zlib/openssl
# binaries over the network as normal; --build=missing rebuilds meshioplusplus
# itself from the archived recipe if your profile doesn't match the prebuilt
# one) -- and a zip of the vcpkg overlay port with the release tarball's
# SHA512 already pinned in (`vcpkg install meshioplusplus
# --overlay-ports=<unzipped dir>`). Both are Linux/x86_64 only, matching this
# workflow's runners.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "conanfile.py"
      - "packages/conan/**"
      - "packages/vcpkg/**"
      - ".github/workflows/packages.yml"
      - "CMakeLists.txt"
      - "src/cpp/**"
      - "bindings/c/**"
      - "cmake/**"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Conan: build + package + run the Conan test package on two option sets -- the
  # no-heavy-deps fallback and the full HDF5/netCDF/zlib build.
  # ---------------------------------------------------------------------------
  conan:
    name: Conan (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        name: [fallback, full]
        include:
          - arch: x86_64
            os: ubuntu-latest
          # GitHub's free-for-public-repos hosted arm64 runner -- native
          # build, matching the same treatment as wheels.yml/cli.yml.
          - arch: arm64
            os: ubuntu-24.04-arm
          - name: fallback
            opts: "-o meshioplusplus/*:with_hdf5=False -o meshioplusplus/*:with_netcdf=False -o meshioplusplus/*:with_zlib=False"
          - name: full
            opts: "-o meshioplusplus/*:with_hdf5=True -o meshioplusplus/*:with_netcdf=True -o meshioplusplus/*:with_zlib=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0,<3"
          conan profile detect --force
      - name: conan create (${{ matrix.name }})
        run: conan create . --test-folder=packages/conan --build=missing ${{ matrix.opts }}
      - name: Save Conan package (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          conan cache save "meshioplusplus/${version}:*" \
            --file="meshioplusplus-conan-${{ matrix.name }}-linux-${{ matrix.arch }}.tgz"
      - name: Upload Conan package artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: conan-${{ matrix.name }}-${{ matrix.arch }}
          path: meshioplusplus-conan-${{ matrix.name }}-linux-${{ matrix.arch }}.tgz

  # ---------------------------------------------------------------------------
  # vcpkg: lint the manifest on every run; on a release tag, pin the tarball
  # SHA512 and build the overlay port end-to-end.
  # ---------------------------------------------------------------------------
  vcpkg-lint:
    name: vcpkg manifest lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: |
          python -c "import json,sys; json.load(open('packages/vcpkg/meshioplusplus/vcpkg.json')); print('meshioplusplus/vcpkg.json OK')"
          python -c "import json,sys; json.load(open('packages/vcpkg/libaec/vcpkg.json')); print('libaec/vcpkg.json OK')"
      - name: format-manifest (schema check)
        # Validates the manifests against vcpkg's schema. It also canonicalizes
        # field order in place; if that changes anything, print the diff as a
        # hint but don't fail the job (run `vcpkg format-manifest` and commit).
        # packages/vcpkg/libaec is our own overlay of vcpkg registry's libaec port (see
        # its portfile.cmake) -- it sources from a GitHub mirror instead of the
        # gitlab.dkrz.de host that had been intermittently rate-limiting this
        # workflow's vcpkg-build job.
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" format-manifest packages/vcpkg/meshioplusplus/vcpkg.json packages/vcpkg/libaec/vcpkg.json
          git diff --exit-code packages/vcpkg/meshioplusplus/vcpkg.json packages/vcpkg/libaec/vcpkg.json \
            || echo "::warning::run 'vcpkg format-manifest packages/vcpkg/meshioplusplus/vcpkg.json packages/vcpkg/libaec/vcpkg.json' and commit the canonical form"

  vcpkg-build:
    name: vcpkg install (overlay)
    runs-on: ubuntu-latest
    # SHA512 of the release tarball is only knowable once the tag exists.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: vcpkg-lint
    steps:
      - uses: actions/checkout@v4
      - name: Pin tarball SHA512
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_REF_NAME}.tar.gz"
          curl -fsSL "$url" -o src.tar.gz
          sha="$(sha512sum src.tar.gz | cut -d' ' -f1)"
          sed -i "s/SHA512 0$/SHA512 ${sha}/" packages/vcpkg/meshioplusplus/portfile.cmake
          grep "SHA512" packages/vcpkg/meshioplusplus/portfile.cmake
      - name: vcpkg install
        run: "\"$VCPKG_INSTALLATION_ROOT/vcpkg\" install meshioplusplus --overlay-ports=\"$PWD/packages/vcpkg\""
      - name: Package overlay port
        # The SHA512 patched into packages/vcpkg/meshioplusplus/portfile.cmake above is
        # local to this checkout (not committed back to the repo, which keeps
        # the placeholder -- see the file's own comment); zip it up so release
        # consumers get a ready-to-use overlay port with no manual hash step.
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -r "meshioplusplus-vcpkg-overlay-port-${version}.zip" packages/vcpkg/meshioplusplus
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-overlay-port
          path: meshioplusplus-vcpkg-overlay-port-*.zip

  # ---------------------------------------------------------------------------
  # Attach the Conan cache-save archives and the vcpkg overlay-port zip to the
  # tag's GitHub Release (creating it if it doesn't exist yet -- none of the
  # other release workflows create one either, they publish to PyPI/npm).
  # ---------------------------------------------------------------------------
  release:
    name: Attach packages to GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [conan, vcpkg-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-packages
          merge-multiple: true
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-packages/*
