name: packages

# Validate (and, on release tags, exercise) the self-hosted Conan recipe and
# vcpkg overlay port for the C API (libmeshioplusplus). Mirrors wheels.yml /
# wasm.yml: PRs validate, `v*` tags run the full release-shaped build.
#
# Neither package is submitted to Conan Center or the upstream vcpkg registry
# (that's a separate, heavier undertaking -- an external PR reviewed by those
# projects, plus ongoing recipe maintenance there), so nothing resolves
# `meshioplusplus` as a plain requirement out of the box. As a stopgap, `v*`
# tags attach ready-to-use package artifacts to the tag's GitHub Release: a
# Conan `cache save` archive per option set -- supplies just the recipe + one
# matching prebuilt binary; restore with `conan cache restore <file>`, then
# `conan install --requires=meshioplusplus/<version> --build=missing -o ...`
# (Conan Center still supplies the transitive hdf5/netcdf/zlib/openssl
# binaries over the network as normal; --build=missing rebuilds meshioplusplus
# itself from the archived recipe if your profile doesn't match the prebuilt
# one) -- and a zip of the vcpkg overlay port with the release tarball's
# SHA512 already pinned in (`vcpkg install meshioplusplus
# --overlay-ports=<unzipped dir>`). Both are Linux/x86_64 only, matching this
# workflow's runners.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "conanfile.py"
      - "packages/conan/**"
      - "packages/vcpkg/**"
      - ".github/workflows/packages.yml"
      - "CMakeLists.txt"
      - "src/cpp/**"
      - "bindings/c/**"
      - "cmake/**"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Conan: build + package + run the Conan test package on two option sets -- the
  # no-heavy-deps fallback and the full HDF5/netCDF/zlib build.
  # ---------------------------------------------------------------------------
  conan:
    name: Conan (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        name: [fallback, full]
        include:
          - arch: x86_64
            os: ubuntu-latest
          # GitHub's free-for-public-repos hosted arm64 runner -- native
          # build, matching the same treatment as wheels.yml/cli.yml.
          - arch: arm64
            os: ubuntu-24.04-arm
          - name: fallback
            opts: "-o meshioplusplus/*:with_hdf5=False -o meshioplusplus/*:with_netcdf=False -o meshioplusplus/*:with_zlib=False -o meshioplusplus/*:with_occt=False"
          - name: full
            opts: "-o meshioplusplus/*:with_hdf5=True -o meshioplusplus/*:with_netcdf=True -o meshioplusplus/*:with_zlib=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0,<3"
          conan profile detect --force
      - name: Use the platform's own cmake on arm64 (ConanCenter's binary is 403ing)
        # ConanCenter's `cmake/binary` recipe fetches prebuilt tarballs straight
        # from cmake.org rather than GitHub, and its conandata.yml entry for
        # 3.31.12/Linux/armv8 (https://cmake.org/files/v3.31/cmake-3.31.12-linux-aarch64.tar.gz)
        # currently 403s unconditionally from cmake.org's own server -- verified
        # directly with `curl`, not runner-specific, and the identical asset on
        # GitHub's release mirror serves fine. That is an upstream ConanCenter/
        # Kitware-hosting problem, not anything in this repo or its recipe, and
        # no retry clears a permanent 403. `[platform_tool_requires]` tells
        # Conan the platform already provides this exact tool_requires match,
        # so it never tries to fetch it -- the GitHub-hosted arm64 runner image
        # ships a working system cmake already (the plain `Linux arm64` build
        # job proves it works for this project). Drop this once ConanCenter's
        # recipe points at a live URL for this version.
        if: matrix.arch == 'arm64'
        run: |
          cmake --version
          printf '[platform_tool_requires]\ncmake/3.31.12\n' >> "$(conan profile path default)"
      - name: Fetch Conan sources from their original URL first, then the backup mirror
        # `core.*` options are only accepted in global.conf; `-c` on the command
        # line (and a profile's [conf]) rejects them with "'core.*'
        # configurations are not allowed in profiles".
        run: |
          printf 'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]\n' >> "$(conan config home)/global.conf"
          cat "$(conan config home)/global.conf"
      - name: conan create (${{ matrix.name }})
        # Retried in case of genuine transient network flakiness elsewhere in
        # the dependency chain; a build failure that is our own (a real
        # recipe/source error) fails identically on every attempt and still
        # turns the job red.
        #
        # Source tarballs are fetched from their original URL first (`origin`)
        # and from ConanCenter's backup mirror second, as configured by the
        # "Fetch Conan sources" step above. The mirror now answers anonymous
        # requests with 401, and Conan stops on that instead of trying the
        # next URL, so the mirror must not come first. The `full` arm64 job
        # has no prebuilt binaries for the autotools tool requirements (m4,
        # libtool) and so downloads and builds their sources from gnu.org,
        # which the arm64 runners have at times been unable to reach at all
        # ("Network is unreachable"); transient outages are retried by the
        # loop below.
        run: |
          for attempt in 1 2 3; do
            if conan create . --test-folder=packages/conan --build=missing ${{ matrix.opts }}; then
              exit 0
            fi
            echo "conan create attempt ${attempt} failed" >&2
            sleep $((attempt * 30))
          done
          exit 1
      - name: Save Conan package (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          conan cache save "meshioplusplus/${version}:*" \
            --file="meshioplusplus-conan-${{ matrix.name }}-linux-${{ matrix.arch }}.tgz"
      - name: Upload Conan package artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: conan-${{ matrix.name }}-${{ matrix.arch }}
          path: meshioplusplus-conan-${{ matrix.name }}-linux-${{ matrix.arch }}.tgz

  # ---------------------------------------------------------------------------
  # vcpkg: lint the manifest on every run; on a release tag, pin the tarball
  # SHA512 and build the overlay port end-to-end.
  # ---------------------------------------------------------------------------
  vcpkg-lint:
    name: vcpkg manifest lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: |
          python -c "import json,sys; json.load(open('packages/vcpkg/meshioplusplus/vcpkg.json')); print('meshioplusplus/vcpkg.json OK')"
          python -c "import json,sys; json.load(open('packages/vcpkg/libaec/vcpkg.json')); print('libaec/vcpkg.json OK')"
      - name: format-manifest (schema check)
        # Validates the manifests against vcpkg's schema. It also canonicalizes
        # field order in place; if that changes anything, print the diff as a
        # hint but don't fail the job (run `vcpkg format-manifest` and commit).
        # packages/vcpkg/libaec is our own overlay of vcpkg registry's libaec port (see
        # its portfile.cmake) -- it sources from a GitHub mirror instead of the
        # gitlab.dkrz.de host that had been intermittently rate-limiting this
        # workflow's vcpkg-build job.
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" format-manifest packages/vcpkg/meshioplusplus/vcpkg.json packages/vcpkg/libaec/vcpkg.json
          git diff --exit-code packages/vcpkg/meshioplusplus/vcpkg.json packages/vcpkg/libaec/vcpkg.json \
            || echo "::warning::run 'vcpkg format-manifest packages/vcpkg/meshioplusplus/vcpkg.json packages/vcpkg/libaec/vcpkg.json' and commit the canonical form"

  vcpkg-build:
    name: vcpkg install (overlay)
    runs-on: ubuntu-latest
    # A tag builds its release tarball. A manual run builds the dispatched commit
    # from its own archive (see the next step), so the 8.0.1 build can run before
    # any tag exists.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: vcpkg-lint
    steps:
      - uses: actions/checkout@v4
      - name: Pin tarball SHA512
        run: |
          # The portfile fetches REF "v${VERSION}", which exists only after the
          # release. A manual run points it at the dispatched commit instead.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$GITHUB_SHA"
            sed -i "s|REF \"v\${VERSION}\"|REF \"${ref}\"|" packages/vcpkg/meshioplusplus/portfile.cmake
          else
            ref="$GITHUB_REF_NAME"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/archive/${ref}.tar.gz"
          curl -fsSL "$url" -o src.tar.gz
          sha="$(sha512sum src.tar.gz | cut -d' ' -f1)"
          sed -i "s/SHA512 0$/SHA512 ${sha}/" packages/vcpkg/meshioplusplus/portfile.cmake
          grep "REF\|SHA512" packages/vcpkg/meshioplusplus/portfile.cmake
      # The default `occt` feature builds vcpkg's opencascade port, which needs
      # gperf, and vcpkg's gperf port is an autotools build that refuses to start
      # without these from the system (the runner image no longer ships them).
      # The port (8.0.1) also builds OpenCASCADE's visualization toolkits, whose
      # TKService includes <X11/Xlib.h>, and its `opengl` dependency only checks
      # for the GL headers, so the X11 and GL development packages come from the
      # system too.
      - name: Install the system packages vcpkg's gperf and opencascade ports need
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool \
            libx11-dev libxext-dev libxi-dev libxmu-dev libgl-dev libglu1-mesa-dev
      - name: vcpkg install
        run: "\"$VCPKG_INSTALLATION_ROOT/vcpkg\" install meshioplusplus --overlay-ports=\"$PWD/packages/vcpkg\""
      - name: Package overlay port
        # The SHA512 patched into packages/vcpkg/meshioplusplus/portfile.cmake above is
        # local to this checkout (not committed back to the repo, which keeps
        # the placeholder -- see the file's own comment); zip it up so release
        # consumers get a ready-to-use overlay port with no manual hash step.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="dispatch-${GITHUB_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          zip -r "meshioplusplus-vcpkg-overlay-port-${version}.zip" packages/vcpkg/meshioplusplus
      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-overlay-port
          path: meshioplusplus-vcpkg-overlay-port-*.zip

  # ---------------------------------------------------------------------------
  # Attach the Conan cache-save archives and the vcpkg overlay-port zip to the
  # tag's GitHub Release (creating it if it doesn't exist yet -- none of the
  # other release workflows create one either, they publish to PyPI/npm).
  # ---------------------------------------------------------------------------
  release:
    name: Attach packages to GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [conan, vcpkg-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-packages
          merge-multiple: true
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-packages/*
