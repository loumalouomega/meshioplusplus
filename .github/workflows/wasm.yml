name: wasm

on:
  push:
    tags: ["v*"]
  # Also on PRs that touch the wasm surface or the C++ core it wraps. This
  # workflow used to be tag-only, which was tenable while the build had no
  # external dependencies; now that it links a wasm32 HDF5 and netCDF, a break
  # would otherwise surface for the first time at release. The path filter and
  # the dependency cache keep the added cost to one short job.
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "build/configure-wasm.sh"
      - "build/build-wasm-deps.sh"
      - "build/patches/**"
      - "bindings/wasm/**"
      - "src/cpp/**"
      - "src/wasm/**"
      - "tests/wasm/**"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build + smoke-test (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the Eigen submodule
        # Targeted, not `submodules: true`: Eigen is the only submodule this
        # build can use (the MED Fortran<->C transpose, now that MED is built
        # here), and a blanket checkout would also pull the Polyscope viewer,
        # which the wasm target must never see.
        uses: ./.github/actions/init-submodules
        with:
          paths: src/cpp/third_party/eigen

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pinned to the version verified locally; bump deliberately. The key
          # of the dependency cache below includes this, since a static wasm
          # archive is only guaranteed to link against a compatible toolchain.
          version: "6.0.3"

      # The wasm32 HDF5/netCDF build takes several minutes and changes only
      # when its pins do, so it is cached rather than rebuilt per run.
      # build/build-wasm-deps.sh is idempotent: on a cache hit the configure
      # step below finds the prefix already populated and skips it entirely.
      - name: Cache the wasm HDF5/netCDF prefix
        uses: actions/cache@v4
        with:
          # The install prefix only -- not build/wasm-deps as a whole, which
          # also holds the downloaded tarballs the script no longer needs once
          # the libraries are installed.
          path: build/wasm-deps/hdf5-*-netcdf-*
          key: wasm-deps-emsdk6.0.3-${{ hashFiles('build/build-wasm-deps.sh', 'build/patches/*.patch') }}

      - name: Build the wasm HDF5/netCDF/cgnslib dependencies
        run: ./build/build-wasm-deps.sh

      - name: Configure + build (WASM)
        # Builds BOTH artifacts: the sequential meshioplusplus_wasm and the
        # threaded (OpenMP/pthreads) meshioplusplus_wasm_mt. Both ship in the
        # npm package; the loader auto-selects between them at runtime.
        run: ./build/configure-wasm.sh --build

      - name: Report artifact size
        # This build links two static C libraries; size regressions are the
        # thing most likely to go unnoticed, since nothing else fails. Four
        # files now (two variants x .mjs/.wasm).
        run: ls -l src/wasm/dist/

      - uses: actions/setup-node@v4
        with:
          # Node 18 is the package's floor (`engines`), and the threaded build's
          # PTHREAD_POOL_SIZE expression is written to work there (navigator is
          # Node >= 21 only). Keeping CI on 20 exercises that fallback path.
          node-version: "20"

      - name: Smoke test
        # Exercises both artifacts: the full suite on the threaded build (Wasm
        # threads work under Node with no cross-origin-isolation headers) plus a
        # sequential-build sanity block.
        run: node tests/wasm/smoke.mjs

      - name: Package sanity check (npm pack --dry-run)
        working-directory: src/wasm
        run: npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: src/wasm/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: build-wasm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/@meshioplusplus/wasm
    permissions:
      # id-token signs the OIDC exchange behind npm trusted publishing; the
      # NPM_TOKEN fallback below covers the transition period only.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: src/wasm

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which supports OIDC trusted publishing (the
          # explicit upgrade below guards against a lagging bundled npm). No
          # registry-url here: it would write an _authToken placeholder that
          # shadows the OIDC exchange. The build job stays on Node 20, which
          # exercises the loader's pre-21 navigator fallback.
          node-version: "24"

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm
        working-directory: src/wasm
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          echo "node $(node --version) / npm $(npm --version); package $PKG@$VER"

          # A retried job must not fail just because an earlier attempt already
          # published (concurrency cancels and flake retries are routine).
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on the registry; nothing to publish"
            exit 0
          fi

          # Primary path: npm trusted publishing (OIDC). No token, so nothing
          # to expire; needs the one-time trusted-publisher entry for this
          # repo, workflow file and environment on npmjs.com (see doc/wasm.md).
          for i in 1 2 3; do
            if npm publish --access public; then
              echo "published $PKG@$VER via OIDC trusted publishing"
              exit 0
            fi
            echo "OIDC publish attempt $i/3 failed; retrying in 15 s"
            sleep 15
          done

          # Fallback: the classic NPM_TOKEN while it still exists. The registry
          # masks a rejected scoped PUT as 404, so validate the token first for
          # a clear error instead of the cryptic "not in this registry".
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::npm publish failed and NPM_TOKEN is unset. Configure trusted publishing on npmjs.com (see doc/wasm.md), then re-run this job."
            exit 1
          fi
          TOKEN_NPMRC="$RUNNER_TEMP/npmrc-token"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$TOKEN_NPMRC"
          if ! NPM_CONFIG_USERCONFIG="$TOKEN_NPMRC" npm whoami --registry https://registry.npmjs.org/; then
            echo "::error::npm publish failed and NPM_TOKEN is rejected by the registry (expired or revoked?). Configure trusted publishing on npmjs.com (see doc/wasm.md) or replace the NPM_TOKEN secret with a fresh token, then re-run this job."
            exit 1
          fi
          for i in 1 2 3; do
            if NPM_CONFIG_USERCONFIG="$TOKEN_NPMRC" npm publish --access public; then
              echo "published $PKG@$VER with NPM_TOKEN"
              exit 0
            fi
            echo "token publish attempt $i/3 failed; retrying in 15 s"
            sleep 15
          done
          echo "::error::npm publish failed with both OIDC and NPM_TOKEN. See doc/wasm.md, then re-run this job."
          exit 1
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
