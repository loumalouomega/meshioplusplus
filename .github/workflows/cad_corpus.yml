name: cad_corpus

# Meshes the real-CAD corpus (roadmap 6.5): public STEP models named by
# source and SHA-256 in tools/cad_corpus/manifest.json, fetched here and never
# stored in the repository. Each model is read through OpenCASCADE, meshed by
# mesh_cad_surface and measured (tools/cad_corpus.py). The job fails when a
# model that meshed in tools/cad_corpus/baseline.json no longer does, naming
# it; a source that cannot be downloaded is reported, not a failure. Gmsh's
# executable (Ubuntu's package) meshes every model too and is measured beside
# ours (roadmap 6.5.4): called through files in a process of its own, never
# linked, since its licence is the GPL; its numbers are reported, not gated.
# Weekly, not on every push: the corpus takes minutes, and a change to the
# mesher is checked by the CAD suites in ci.yml first.
on:
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      models:
        description: "a comma-separated subset of model ids (empty: all)"
        default: ""

permissions:
  contents: read

jobs:
  corpus:
    name: Mesh the CAD corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native libraries
        run: |
          # See ci.yml's kahip job: an unused, preinstalled third-party apt
          # source must not take the whole step down.
          sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libtbb-dev pkg-config \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev gmsh
          gmsh --version
      - name: Install meshioplusplus with OpenCASCADE
        run: |
          python -m pip install --upgrade pip
          CMAKE_ARGS="-DMESHIOPLUSPLUS_WITH_OCCT=ON" python -m pip install .
          python -c "from meshioplusplus import _core; assert _core.__has_occt__"
      - name: Fetch the corpus
        run: python tools/cad_corpus.py fetch --dest corpus --record corpus-hashes.json
      - name: Mesh and measure every model
        env:
          MODELS: ${{ inputs.models }}
        run: |
          python tools/cad_corpus.py run --dest corpus --out cad-corpus.json --gmsh \
            ${MODELS:+--models "$MODELS"}
      - name: Job summary
        if: always()
        run: |
          if [ -f cad-corpus.json ]; then
            python tools/cad_corpus.py summary cad-corpus.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-corpus
          path: |
            cad-corpus.json
            corpus-hashes.json
          if-no-files-found: ignore
      - name: Compare with the baseline
        run: python tools/cad_corpus.py compare cad-corpus.json
