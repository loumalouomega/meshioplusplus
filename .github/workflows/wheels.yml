name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # vendored Eigen (MED transpose)

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          # Portable wheels: the optional HDF5/netCDF/zlib native paths are
          # turned OFF, so the only build requirement is a C++20 compiler.
          # HDF5/netCDF formats and VTU zlib work through the h5py/netCDF4
          # runtime extras and the stdlib, exactly as the fallback shims intend.
          # The parallel backend is AUTO -> OpenMP (MSVC's built-in OpenMP on Windows,
          # libomp on macOS; delvewheel/delocate bundle it automatically). Linux wheels
          # are forced to SEQ instead - see the manylinux_2_28 comment below.
          # macOS 13.3+ is required for std::format (its floating-point
          # formatting symbols live in the OS libc++ dylib).
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # macOS: libomp gives Apple clang an OpenMP runtime (libc++ has no PSTL).
          CIBW_BEFORE_ALL_MACOS: "brew install libomp"
          # manylinux2014's stock compiler (devtoolset-10, GCC 10) has no <format>
          # (needs GCC 13+ per the C++20 std::format requirement above). manylinux_2_28
          # (AlmaLinux 8) ships gcc-toolset-13 as an installable SCL package.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "yum install -y gcc-toolset-13-gcc gcc-toolset-13-gcc-c++"
          # gcc-toolset-13's libstdc++ is newer than manylinux_2_28's baseline, so the
          # resulting .so pulls in versioned symbols auditwheel rejects unless libgcc/
          # libstdc++ are statically linked in (LDFLAGS seeds CMake's *_LINKER_FLAGS).
          # AUTO's OpenMP preference is forced to SEQ here too: gcc-toolset-13's libgomp
          # has no static-link option GCC recognizes ("-static-libgomp" isn't a real GCC
          # flag, unlike -static-libgcc/-static-libstdc++), so it would stay a dynamic
          # dependency and hit the same versioned-symbol rejection. These wheels already
          # trade native HDF5/netCDF/zlib for portability (see above) - SEQ keeps that
          # trade consistent; TBB/OpenMP builds remain available from source.
          CIBW_ENVIRONMENT_LINUX: >-
            CC="/opt/rh/gcc-toolset-13/root/usr/bin/gcc"
            CXX="/opt/rh/gcc-toolset-13/root/usr/bin/g++"
            LDFLAGS="-static-libgcc -static-libstdc++"
            CMAKE_ARGS="-DMESHIOPLUSPLUS_WITH_HDF5=OFF -DMESHIOPLUSPLUS_WITH_NETCDF=OFF -DMESHIOPLUSPLUS_WITH_ZLIB=OFF -DMESHIOPLUSPLUS_PARALLEL_BACKEND=SEQ"
          # -v surfaces which specific symbol/library trips the manylinux_2_28 policy
          # check if the static-linking above still isn't enough, instead of auditwheel's
          # generic "too-recent versioned symbols" message.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -v -w {dest_dir} {wheel}"
          CIBW_ENVIRONMENT: >-
            CMAKE_ARGS="-DMESHIOPLUSPLUS_WITH_HDF5=OFF -DMESHIOPLUSPLUS_WITH_NETCDF=OFF -DMESHIOPLUSPLUS_WITH_ZLIB=OFF"
            MACOSX_DEPLOYMENT_TARGET="13.3"
          CIBW_TEST_REQUIRES: "pytest h5py"
          CIBW_TEST_COMMAND: "python -c \"import meshioplusplus; print(meshioplusplus.__version__, meshioplusplus._core.__parallel_backend__)\""

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/meshioplusplus
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
