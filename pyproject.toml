[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "meshio"
version = "5.3.5"
description = "I/O for many mesh formats"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.txt"}
keywords = [
  "mesh",
  "file formats",
  "scientific",
  "engineering",
  "fem",
  "finite elements"
]
authors = [
  {email = "nico.schloemer@gmail.com"},
  {name = "Nico Schlömer"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = [
  "importlib_metadata; python_version<'3.8'",
  "numpy>=1.20.0",
  "rich",
]

[project.optional-dependencies]
all = [
    "netCDF4",
    "h5py"  # CGNS, H5M, MED, XDMF formats
]

[project.urls]
homepage = "https://github.com/nschloe/meshio"
code = "https://github.com/nschloe/meshio"
issues = "https://github.com/nschloe/meshio/issues"

[project.scripts]
meshio = "meshio._cli:main"

[tool.scikit-build]
# scikit-build-core drives the CMake build of the meshio._core extension and
# bundles it next to the pure-Python package (src layout).
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/meshio"]
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.editable]
# Rebuild the extension automatically on import during development.
rebuild = true
verbose = false

[tool.isort]
profile = "black"

