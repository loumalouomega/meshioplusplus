[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "meshioplusplus"
version = "10.6.0"
description = "meshio++: I/O for many mesh formats (C++20 core + Python bindings)"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = [
  "mesh",
  "file formats",
  "scientific",
  "engineering",
  "fem",
  "finite elements"
]
authors = [
  {email = "tote1989@gmail.com"},
  {name = "Vicente Mataix Ferrándiz"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = [
  "importlib_metadata; python_version<'3.8'",
  "numpy>=1.20.0",
  "rich",
]

[project.optional-dependencies]
# Pure-Python readers/writers for the optional VTK XML block codecs. Not a
# default dependency: a build with the C++ codecs needs neither.
codecs = ["lz4", "zstandard"]
# The KaHIP Python wheel (MIT): gives the pure-Python fallback the quality
# partition path when the C++ core was built without MESHIOPLUSPLUS_WITH_KAHIP.
kahip = ["kahip"]
# Polyscope (MIT): the desktop backend of `view()` and all of `screenshot()`.
# Python-only and strictly optional -- it never reaches the C++/WASM/C/Fortran
# core, and the browser backend of `view()` needs nothing from this extra.
viewer = ["polyscope>=2.4"]
# In-memory interoperability (src/python/meshioplusplus/_interop.py). Python-only
# and strictly optional: none of these reaches the C++/WASM/C/Fortran core, and
# every import is lazy, so the package works exactly as before without them.
# Deliberately NOT in `all`, which means "the optional deps the FORMATS need"
# (h5py/netCDF4) -- quietly adding a PyVista-sized dependency there would
# surprise people. `viewer`/`kahip`/`codecs` stand apart for the same reason.
pyvista = ["pyvista>=0.44"]
trimesh = ["trimesh>=4.0"]
arrow = ["pyarrow>=14"]
# pandas 2.x needs Python >= 3.9 while the package floor stays 3.8 -- the mcp
# extra's precedent: the pure payload layer works everywhere, only the frame
# entry points need the extra.
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
# The `write_dataset(format="zarr")` chunked-dataset backend (parquet rides
# [arrow]; hdf5 rides h5py from [all]). Works with zarr-python 2.x and 3.x.
# There is deliberately NO extra for torch/jax (to_torch/to_jax): torch's
# default Linux wheel bundles CUDA at ~900 MB and JAX's accelerator variants
# live in its own extras -- the CuPy no-extra precedent (see doc/ml.md).
zarr = ["zarr>=2.16"]
interop = [
    "pyvista>=0.44",
    "trimesh>=4.0",
    "pyarrow>=14",
    "pandas>=2.0",
    "polars>=1.0",
]
# The MCP server (src/python/meshioplusplus/mcp/): exposes every operation to
# AI agents over the Model Context Protocol. Python-only, lazy import, and NOT
# in `all` for the same reason as the interop extras. Note the `mcp` SDK
# itself requires Python >= 3.10 while the package floor stays 3.8 -- the pure
# tool layer works everywhere, only running the server needs this extra.
#
# Upper-bounded at <2 deliberately: the SDK's 2.0.0 removed `mcp.server.fastmcp`
# outright, replacing it with a different server API (`mcp.server.mcpserver`), so
# `_server.py`'s `from mcp.server.fastmcp import FastMCP` raises ModuleNotFound
# there. The bound is not caution about an unseen release -- it was an unbounded
# `>=1.2` that let CI resolve 2.0.0 and fail. Porting to the 2.x API is a
# separate piece of work; until then this pins the SDK the server is written
# against. The pure tool layer (`_tools.py`) imports no SDK and is unaffected.
mcp = ["mcp>=1.2,<2"]
all = [
    "netCDF4",
    "h5py",  # CGNS, H5M, MED, XDMF formats
    "polyscope>=2.4"  # the desktop viewer backend
]

[project.urls]
homepage = "https://github.com/loumalouomega/meshioplusplus"
code = "https://github.com/loumalouomega/meshioplusplus"
issues = "https://github.com/loumalouomega/meshioplusplus/issues"

[project.scripts]
meshioplusplus = "meshioplusplus._cli:main"
# Entry goes through meshioplusplus.mcp (not ._server directly) so a missing
# [mcp] extra prints the named `pip install meshioplusplus[mcp]` error instead
# of an ImportError traceback.
meshioplusplus-mcp = "meshioplusplus.mcp:main"

[tool.scikit-build]
# scikit-build-core drives the CMake build of the meshioplusplus._core
# extension and bundles it next to the pure-Python package (src layout).
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/python/meshioplusplus"]
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.editable]
# Rebuild the extension automatically on import during development.
rebuild = true
verbose = false

[tool.coverage.run]
# The `coverage` CI job measures the installed package through an editable
# install, so coverage.py would otherwise record absolute
# .../src/python/meshioplusplus/... paths that Codecov's `python` flag
# (paths: src/python/meshioplusplus/) can't match. `relative_files` rewrites them to
# repo-relative paths; `source` scopes measurement to the package.
source = ["meshioplusplus"]
relative_files = true

[tool.isort]
profile = "black"

# [options.data_files]
# share/paraview-5.9/plugins =
#     tools/paraview-meshioplusplus-plugin.py
