[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "meshioplusplus"
version = "7.13.0"
description = "meshio++: I/O for many mesh formats (C++20 core + Python bindings)"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = [
  "mesh",
  "file formats",
  "scientific",
  "engineering",
  "fem",
  "finite elements"
]
authors = [
  {email = "tote1989@gmail.com"},
  {name = "Vicente Mataix Ferrándiz"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = [
  "importlib_metadata; python_version<'3.8'",
  "numpy>=1.20.0",
  "rich",
]

[project.optional-dependencies]
# Pure-Python readers/writers for the optional VTK XML block codecs. Not a
# default dependency: a build with the C++ codecs needs neither.
codecs = ["lz4", "zstandard"]
# The KaHIP Python wheel (MIT): gives the pure-Python fallback the quality
# partition path when the C++ core was built without MESHIOPLUSPLUS_WITH_KAHIP.
kahip = ["kahip"]
# Polyscope (MIT): the desktop backend of `view()` and all of `screenshot()`.
# Python-only and strictly optional -- it never reaches the C++/WASM/C/Fortran
# core, and the browser backend of `view()` needs nothing from this extra.
viewer = ["polyscope>=2.4"]
all = [
    "netCDF4",
    "h5py",  # CGNS, H5M, MED, XDMF formats
    "polyscope>=2.4"  # the desktop viewer backend
]

[project.urls]
homepage = "https://github.com/loumalouomega/meshioplusplus"
code = "https://github.com/loumalouomega/meshioplusplus"
issues = "https://github.com/loumalouomega/meshioplusplus/issues"

[project.scripts]
meshioplusplus = "meshioplusplus._cli:main"

[tool.scikit-build]
# scikit-build-core drives the CMake build of the meshioplusplus._core
# extension and bundles it next to the pure-Python package (src layout).
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/meshioplusplus"]
cmake.version = ">=3.15"
cmake.build-type = "Release"

[tool.scikit-build.editable]
# Rebuild the extension automatically on import during development.
rebuild = true
verbose = false

[tool.coverage.run]
# The `coverage` CI job measures the installed package through an editable
# install, so coverage.py would otherwise record absolute
# .../src/meshioplusplus/... paths that Codecov's `python` flag
# (paths: src/meshioplusplus/) can't match. `relative_files` rewrites them to
# repo-relative paths; `source` scopes measurement to the package.
source = ["meshioplusplus"]
relative_files = true

[tool.isort]
profile = "black"

