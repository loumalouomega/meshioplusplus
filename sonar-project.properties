# SonarCloud analysis of meshio++ (doc/static_analysis.md).
#
# The scan runs in .github/workflows/sonarcloud.yml, on pushes to `master`
# and on demand: it reads the compile_commands.json that workflow merges from
# two configure-only CMake trees for the C/C++ analysis. Nothing is built or
# tested there, so no coverage is reported (Codecov has it). It is skipped
# (with a warning) until the SONAR_TOKEN secret is set.
#
# The organization and key are SonarCloud's defaults for a GitHub import of
# loumalouomega/meshioplusplus; change them here if the project was imported
# under other names.
sonar.organization=loumalouomega
sonar.projectKey=loumalouomega_meshioplusplus
sonar.projectName=meshio++
sonar.sourceEncoding=UTF-8

sonar.sources=src/cpp,src/python/meshioplusplus,bindings
sonar.tests=tests

# Vendored third-party code, the generated amalgamated header (a verbatim copy
# of src/cpp, which would otherwise dominate the duplication measure), the
# generated tables (tools/gen_*.py) and the bindings Codecov also ignores.
sonar.exclusions=\
  src/cpp/third_party/**,\
  src/single_include/**,\
  src/cpp/src/detail/hex_dual_scheme_tables.cpp,\
  src/cpp/src/detail/colormap.cpp,\
  src/cpp/include/meshioplusplus/detail/colormap.hpp,\
  src/python/meshioplusplus/_colormap.py,\
  src/python/meshioplusplus/_format_table.py,\
  src/python/meshioplusplus/_pipeline_table.py,\
  src/cpp/src/operations/pipeline_table.hpp,\
  src/python/meshioplusplus/nastran_h5/_schema.py,\
  bindings/wasm/**,\
  bindings/fortran/**,\
  **/node_modules/**
# Test fixtures (Git LFS meshes, fuzz regressions) are data, not test code.
sonar.test.exclusions=\
  tests/python/meshes/**,\
  tests/python/input/**,\
  tests/fuzz/**
# Duplication is measured on library code; tests repeat their setup on purpose.
# Files that are literal tables alone only look duplicated: the detector
# normalises literals, so two tables of the same shape match although no entry
# agrees (roadmap §7; tools/dup_report.py skips the same files). The viewer
# page is a single-file bundle whose repeats are vtk.js's own WebGPU shader
# templates, not code of this repository; its issues are still analysed.
sonar.cpd.exclusions=\
  tests/**,\
  src/cpp/src/detail/node_order.cpp,\
  src/python/meshioplusplus/_viewer_assets/viewer.html

# Findings recorded as by design, once per rule (roadmap §8, doc/static_analysis.md).
# The library's top-level modules open the paths and read the files their caller
# names (`read`, `write`, sniffing, sequences, pipelines, provenance): that is what
# a mesh library is for, so the taint rules' "path from file content" reports there
# describe the API, not a hole. The MCP server (`mcp/`), where the caller is not
# trusted, is not covered and keeps its own path sandbox. The trainer reads and
# writes the spec and the state files of the job directory the server laid out.
#
# python:S1244 (floating-point equality): each of the 88 reports of the first scan
# was read, and each compares with an exact sentinel on purpose (0.0 as "unset" or
# "degenerate", 1.0 as "no scaling", a value read back from a file) where the
# Python reference must agree with the C++ core bit for bit; a tolerance there
# would break that parity. Black reflows a long condition onto several lines,
# which would strand an inline NOSONAR, so the decision is recorded here instead.
#
# Python's inline marker does not close a finding when it names the rule with
# its repository (`# NOSONAR(python:S2245)` was reported anyway), and the taint
# rules (`cppsecurity:*`, `pythonsecurity:*`) are never closed inline, so the
# decisions below are recorded per file:
# - python:S2245 in `_dataset.py` and `_point_budget.py`: a locally seeded
#   `random.Random` draws a reproducible split or sample, never a secret.
# - python:S5332 in `mcp/_http.py`: the address uvicorn serves is plain HTTP; the
#   default host is loopback and a non-loopback one is warned about.
# - pythonsecurity:S6549 in `mcp/_jobs.py`: `job_dir` refuses a job id with a
#   separator, `.` or `..`, and a checkpoint name is reduced to its basename
#   inside that job's directory before it is tested.
# - cppsecurity:S2083 in `cli/tui/music.cpp`: the path removed is the player's
#   own `mkdtemp` directory and the `loop.wav` it wrote there, never input.
# - cppsecurity:S5145 in `detail/fast_number.hpp`: `vsnprintf_classic` and
#   `snprintf_c` format numbers into the caller's buffer and log nothing; their
#   formats are literals that MESHIOPLUSPLUS_PRINTF_LIKE checks at compile time.
# - Web:S6845 in the embedded viewer page: the sidebar splitter is the WAI-ARIA
#   window-splitter pattern (a focusable `role="separator"`) and the table body
#   a scrollable `role="region"` that takes focus so the keyboard can scroll it;
#   without `tabindex` neither is reachable from the keyboard.
sonar.issue.ignore.multicriteria=api_path,api_oracle,train_path,train_cli,exact_float,seeded_rng_dataset,seeded_rng_budget,mcp_http,mcp_jobs_oracle,music_tmp,fast_number_fmt,viewer_a11y
sonar.issue.ignore.multicriteria.seeded_rng_dataset.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.seeded_rng_dataset.resourceKey=src/python/meshioplusplus/_dataset.py
sonar.issue.ignore.multicriteria.seeded_rng_budget.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.seeded_rng_budget.resourceKey=src/python/meshioplusplus/_point_budget.py
sonar.issue.ignore.multicriteria.mcp_http.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.mcp_http.resourceKey=src/python/meshioplusplus/mcp/_http.py
sonar.issue.ignore.multicriteria.mcp_jobs_oracle.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.mcp_jobs_oracle.resourceKey=src/python/meshioplusplus/mcp/_jobs.py
sonar.issue.ignore.multicriteria.music_tmp.ruleKey=cppsecurity:S2083
sonar.issue.ignore.multicriteria.music_tmp.resourceKey=src/cpp/cli/tui/music.cpp
sonar.issue.ignore.multicriteria.fast_number_fmt.ruleKey=cppsecurity:S5145
sonar.issue.ignore.multicriteria.fast_number_fmt.resourceKey=src/cpp/include/meshioplusplus/detail/fast_number.hpp
sonar.issue.ignore.multicriteria.viewer_a11y.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.viewer_a11y.resourceKey=src/python/meshioplusplus/_viewer_assets/viewer.html
sonar.issue.ignore.multicriteria.exact_float.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.exact_float.resourceKey=src/python/meshioplusplus/**/*.py
sonar.issue.ignore.multicriteria.api_path.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.api_path.resourceKey=src/python/meshioplusplus/*.py
sonar.issue.ignore.multicriteria.api_oracle.ruleKey=pythonsecurity:S6549
sonar.issue.ignore.multicriteria.api_oracle.resourceKey=src/python/meshioplusplus/*.py
sonar.issue.ignore.multicriteria.train_path.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.train_path.resourceKey=src/python/meshioplusplus/physicsnemo/_train.py
sonar.issue.ignore.multicriteria.train_cli.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.train_cli.resourceKey=src/python/meshioplusplus/physicsnemo/_train.py

# C/C++: the merged compilation database of the workflow's two configure-only
# trees (the GoogleTest/C API tree and the Python extension's).
sonar.cfamily.compile-commands=compile_commands.json
sonar.cfamily.analysisCache.mode=server

sonar.python.version=3.10,3.11,3.12,3.13
