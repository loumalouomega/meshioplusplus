comment: no

# Coverage arrives from the `coverage` job in .github/workflows/ci.yml as two
# uploads: the Python package (coverage.xml, pytest-cov) and the C++20 core
# (cpp-coverage.info, lcov). Both are produced in the same job, so the C++
# numbers include the format code reached through the pybind11 shims rather
# than only what the GoogleTest binary touches. That job runs on pushes to
# `master` and on `v*` release tags only; pull requests upload nothing.

codecov:
  notify:
    # Wait for BOTH uploads before evaluating anything. Without this Codecov
    # notifies as soon as the first one lands, so the un-flagged `project`
    # status is computed from the Python half alone and reports a large phantom
    # drop -- 70.79% (-7.69%) against a real 78.47% on PR #53, and the same
    # thing on #52. It corrects itself seconds later when the second upload
    # arrives, but only for the commit *status*: the check-run created from the
    # partial report is never revised, so the PR keeps a red mark that no
    # re-run clears (Codecov will not re-evaluate a sha it has already
    # processed). Both flags come from one job, so 2 is exact, not a guess.
    after_n_builds: 2
flags:
  python:
    paths:
      - src/python/meshioplusplus/
    carryforward: false
  cpp:
    paths:
      - src/cpp/
      - bindings/
    carryforward: false

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    # Reported for the commits that actually carry a coverage upload: pushes to
    # master and v* release tags. A PR has no report of its own, so it gets no
    # Codecov status from this configuration.
    project:
      default:
        target: auto
        threshold: 1%
      python:
        flags: [python]
        target: auto
        threshold: 1%
      cpp:
        flags: [cpp]
        target: auto
        threshold: 1%
    # A patch status needs the PR's own coverage report, which this repository
    # no longer produces (the coverage job is master/tag only). Leave it off
    # rather than show a permanently "missing" check on every PR.
    patch: false

ignore:
  - "tests/python/"
  - "tests/cpp/"
  - "benchmark/"
  - "src/cpp/third_party/"
  - "doc/"
  - "example/"
  - "tools/"
  # Generated single-header amalgamation: a verbatim duplicate of src/cpp/ (kept in
  # sync by CI). Counting it would double every src/cpp/ line.
  - "src/single_include/"
  # Non-MESHIO mesh backends: instantiated only by the standalone `cpp-tests`
  # backend matrix, never by the MESHIO-only instrumented `coverage` job, so
  # they are structurally unreachable here. Mirrors the lcov --remove in ci.yml.
  - "src/cpp/include/meshioplusplus/backends/native_mesh.hpp"
  - "src/cpp/include/meshioplusplus/backends/kratos_mesh.hpp"
  - "src/cpp/include/meshioplusplus/backends/model_part.hpp"
  - "src/cpp/include/meshioplusplus/backends/kratos_names.hpp"
  # Link-time sentinels. Each defines exactly one function that is NEVER called
  # -- only its address is taken, from a `gnu::used` pointer in the matching
  # header -- so the whole point is that it costs a relocation and no execution.
  # It can therefore never show coverage in any build, and counting it just
  # reports a permanent 0% on two files that are working exactly as designed.
  # Mirrors the lcov --remove in ci.yml.
  - "src/cpp/src/abi_version_check.cpp"
  - "src/cpp/src/mesh_backend_check.cpp"
  # Not compiled by the coverage job (no Emscripten / no Fortran toolchain in
  # this job); listed for clarity so a future config change can't silently
  # start counting them as uncovered.
  - "bindings/wasm/"
  - "bindings/fortran/"
